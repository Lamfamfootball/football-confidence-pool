<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LamFam 2026-2027 Leaderboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}

header {
    background: #1f2937;
    color: white;
    text-align: center;
    padding: 20px;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

.container {
    max-width: 1200px;
    margin: 20px auto;
    padding: 0 15px;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 25px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.card h2 {
    margin-top: 0;
    text-align: center;
}

.table-container {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 500px;
}

th,
td {
    padding: 10px 12px;
    border-bottom: 1px solid #ddd;
    text-align: center;
    white-space: nowrap;
}

th {
    background: #f0f2f5;
    font-weight: bold;
}

td:first-child,
th:first-child {
    text-align: left;
}

tr:last-child td {
    border-bottom: none;
}

.rank {
    font-weight: bold;
    width: 50px;
}

.player {
    font-weight: bold;
}

.winner {
    font-weight: bold;
}

.total-column {
    font-weight: bold;
    background: #f0f2f5;
}

.week-column {
    min-width: 65px;
}

.loading {
    text-align: center;
    padding: 20px;
    color: #666;
}

.no-data {
    text-align: center;
    padding: 20px;
    color: #777;
}

@media (max-width: 600px) {
    header h1 {
        font-size: 23px;
    }

    .card {
        padding: 12px;
    }

    th,
    td {
        padding: 8px;
        font-size: 14px;
    }
}
</style>
</head>

<body>

<header>
    <h1>LamFam 2026-2027 Leaderboard</h1>
</header>

<div class="container">

    <!-- WEEKLY WINNERS -->
    <div class="card">
        <h2>🏆 Weekly Winners</h2>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Week</th>
                        <th>Winner</th>
                        <th>Confidence Points</th>
                    </tr>
                </thead>
                <tbody id="weeklyWinnersBody">
                    <tr>
                        <td colspan="3" class="loading">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>


    <!-- WINS BY WEEK -->
    <div class="card">
        <h2>📈 Wins by Week — Progression</h2>

        <div class="table-container">
            <table id="winsByWeekTable">
                <thead id="winsByWeekHead">
                    <tr>
                        <th>Player</th>
                        <th>Total</th>
                    </tr>
                </thead>

                <tbody id="winsByWeekBody">
                    <tr>
                        <td colspan="2" class="loading">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>


    <!-- SEASON STANDINGS -->
    <div class="card">
        <h2>🏆 Season Standings</h2>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Player</th>
                        <th>Total Wins</th>
                        <th>Confidence Points</th>
                    </tr>
                </thead>

                <tbody id="seasonLeaderboardBody">
                    <tr>
                        <td colspan="4" class="loading">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>


<script>

const SUPABASE_URL = "https://YOUR-PROJECT.supabase.co";
const SUPABASE_ANON_KEY = "YOUR-ANON-KEY";

const supabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


/* =========================================================
   GAME COMPLETION
========================================================= */

function isGameCompleted(game) {

    const winner = game.Winner;

    if (
        winner === null ||
        winner === undefined ||
        winner === "" ||
        String(winner).toLowerCase() === "null" ||
        String(winner).toLowerCase() === "tbd"
    ) {
        return false;
    }

    return true;
}


/* =========================================================
   SPREAD
========================================================= */

function getTeamSpread(game, team) {

    const spread = Number(game.spread);

    if (Number.isNaN(spread)) {
        return 0;
    }

    /*
       The database stores the spread for the favorite.
       If team1 is the favorite, team1 gets the negative spread.
       If team2 is the favorite, team2 gets the negative spread.
    */

    if (game.team1 === team) {
        return spread;
    }

    if (game.team2 === team) {
        return -spread;
    }

    return 0;
}


/* =========================================================
   ATS RESULT
========================================================= */

function pickIsWin(pick, game) {

    if (!isGameCompleted(game)) {
        return false;
    }

    const pickedTeam = pick["team-picked"];

    if (!pickedTeam) {
        return false;
    }

    const team1 = game.team1;
    const team2 = game.team2;

    const homeTeam = game.home_team;

    let pickedScore;
    let opponentScore;

    if (pickedTeam === homeTeam) {

        pickedScore = Number(game.home_score);
        opponentScore = Number(game.away_score);

    } else {

        pickedScore = Number(game.away_score);
        opponentScore = Number(game.home_score);
    }

    if (
        Number.isNaN(pickedScore) ||
        Number.isNaN(opponentScore)
    ) {
        return false;
    }

    const spread = getTeamSpread(game, pickedTeam);

    const atsResult =
        (pickedScore + spread) - opponentScore;

    /*
       Push counts as a win.
    */

    return atsResult >= 0;
}


/* =========================================================
   WEEKLY WINNERS
========================================================= */

async function loadWeeklyWinners() {

    const tbody =
        document.getElementById("weeklyWinnersBody");

    tbody.innerHTML =
        `<tr><td colspan="3" class="loading">Loading...</td></tr>`;

    try {

        const { data: games, error: gamesError } =
            await supabase
                .from("games")
                .select("*")
                .gte("week", 1)
                .lte("week", 18);

        if (gamesError) throw gamesError;


        const { data: picks, error: picksError } =
            await supabase
                .from("Picks")
                .select("*")
                .gte("week", 1)
                .lte("week", 18);

        if (picksError) throw picksError;


        const weeklyResults = [];


        for (let week = 1; week <= 18; week++) {

            const weekGames =
                games.filter(g => Number(g.week) === week);

            const completedGames =
                weekGames.filter(isGameCompleted);

            if (completedGames.length === 0) {
                continue;
            }


            const weekPicks =
                picks.filter(p => Number(p.week) === week);


            const players = {};


            weekPicks.forEach(pick => {

                const player =
                    pick["player-name"] || "Unknown";

                const game =
                    weekGames.find(
                        g => String(g.id) === String(pick.game_id)
                    );

                if (!game) return;

                if (!players[player]) {
                    players[player] = 0;
                }

                if (pickIsWin(pick, game)) {

                    players[player] +=
                        Number(pick.confidence) || 0;
                }

            });


            const entries =
                Object.entries(players);

            if (entries.length === 0) {
                continue;
            }


            const highest =
                Math.max(...entries.map(e => e[1]));


            const winners =
                entries
                    .filter(e => e[1] === highest)
                    .map(e => e[0]);


            weeklyResults.push({
                week,
                winners,
                points: highest
            });
        }


        if (weeklyResults.length === 0) {

            tbody.innerHTML =
                `<tr>
                    <td colspan="3" class="no-data">
                        No completed weeks yet.
                    </td>
                </tr>`;

            return;
        }


        tbody.innerHTML = "";


        weeklyResults.forEach(result => {

            const row =
                document.createElement("tr");

            row.innerHTML = `
                <td>Week ${result.week}</td>
                <td class="winner">
                    ${result.winners.join(", ")}
                </td>
                <td>${result.points}</td>
            `;

            tbody.appendChild(row);
        });

    } catch (error) {

        console.error(
            "Error loading weekly winners:",
            error
        );

        tbody.innerHTML =
            `<tr>
                <td colspan="3" class="no-data">
                    Error loading weekly winners.
                </td>
            </tr>`;
    }
}


/* =========================================================
   WINS BY WEEK — PROGRESSION
========================================================= */

async function loadWinsByWeek() {

    const head =
        document.getElementById("winsByWeekHead");

    const body =
        document.getElementById("winsByWeekBody");


    body.innerHTML =
        `<tr>
            <td colspan="2" class="loading">
                Loading...
            </td>
        </tr>`;


    try {

        const { data: games, error: gamesError } =
            await supabase
                .from("games")
                .select("*")
                .gte("week", 1)
                .lte("week", 18);

        if (gamesError) throw gamesError;


        const { data: picks, error: picksError } =
            await supabase
                .from("Picks")
                .select("*")
                .gte("week", 1)
                .lte("week", 18);

        if (picksError) throw picksError;


        /*
           Find the latest week that actually has
           completed games.
        */

        let latestCompletedWeek = 0;

        for (let week = 1; week <= 18; week++) {

            const weekGames =
                games.filter(
                    g => Number(g.week) === week
                );

            if (
                weekGames.some(isGameCompleted)
            ) {
                latestCompletedWeek = week;
            }
        }


        if (latestCompletedWeek === 0) {

            body.innerHTML =
                `<tr>
                    <td colspan="2" class="no-data">
                        No completed games yet.
                    </td>
                </tr>`;

            return;
        }


        /*
           Get all players.
        */

        const playerNames = new Set();

        picks.forEach(pick => {

            if (pick["player-name"]) {
                playerNames.add(
                    pick["player-name"]
                );
            }

        });


        /*
           Build wins for every player/week.
        */

        const playerWeeklyWins = {};


        playerNames.forEach(player => {

            playerWeeklyWins[player] = {};

            for (
                let week = 1;
                week <= latestCompletedWeek;
                week++
            ) {

                playerWeeklyWins[player][week] = 0;
            }
        });


        for (
            let week = 1;
            week <= latestCompletedWeek;
            week++
        ) {

            const weekGames =
                games.filter(
                    g => Number(g.week) === week
                );


            const weekPicks =
                picks.filter(
                    p => Number(p.week) === week
                );


            weekPicks.forEach(pick => {

                const player =
                    pick["player-name"];

                if (!player) return;


                const game =
                    weekGames.find(
                        g =>
                            String(g.id) ===
                            String(pick.game_id)
                    );


                if (!game) return;


                if (pickIsWin(pick, game)) {

                    if (
                        playerWeeklyWins[player] &&
                        playerWeeklyWins[player][week]
                        !== undefined
                    ) {

                        playerWeeklyWins[player][week]++;
                    }
                }

            });
        }


        /*
           Sort players by total wins,
           then player name.
        */

        const sortedPlayers =
            Array.from(playerNames).sort(
                (a, b) => {

                    let totalA = 0;
                    let totalB = 0;


                    for (
                        let week = 1;
                        week <= latestCompletedWeek;
                        week++
                    ) {

                        totalA +=
                            playerWeeklyWins[a][week] || 0;

                        totalB +=
                            playerWeeklyWins[b][week] || 0;
                    }


                    if (totalB !== totalA) {
                        return totalB - totalA;
                    }

                    return a.localeCompare(b);
                }
            );


        /*
           Build header.
        */

        head.innerHTML = `
            <tr>
                <th>Player</th>

                ${Array.from(
                    { length: latestCompletedWeek },
                    (_, i) =>
                        `<th class="week-column">
                            Week ${i + 1}
                        </th>`
                ).join("")}

                <th class="total-column">
                    Total
                </th>
            </tr>
        `;


        /*
           Build rows.
        */

        body.innerHTML = "";


        sortedPlayers.forEach(player => {

            let total = 0;


            const row =
                document.createElement("tr");


            let html =
                `<td class="player">${player}</td>`;


            for (
                let week = 1;
                week <= latestCompletedWeek;
                week++
            ) {

                const wins =
                    playerWeeklyWins[player][week] || 0;

                total += wins;


                html += `
                    <td class="week-column">
                        ${wins}
                    </td>
                `;
            }


            html += `
                <td class="total-column">
                    ${total}
                </td>
            `;


            row.innerHTML = html;

            body.appendChild(row);
        });


    } catch (error) {

        console.error(
            "Error loading wins by week:",
            error
        );

        body.innerHTML =
            `<tr>
                <td colspan="2" class="no-data">
                    Error loading wins by week.
                </td>
            </tr>`;
    }
}


/* =========================================================
   SEASON STANDINGS
========================================================= */

async function loadSeasonLeaderboard() {

    const tbody =
        document.getElementById(
            "seasonLeaderboardBody"
        );


    tbody.innerHTML =
        `<tr>
            <td colspan="4" class="loading">
                Loading...
            </td>
        </tr>`;


    try {

        const { data: games, error: gamesError } =
            await supabase
                .from("games")
                .select("*")
                .gte("week", 1)
                .lte("week", 18);

        if (gamesError) throw gamesError;


        const { data: picks, error: picksError } =
            await supabase
                .from("Picks")
                .select("*")
                .gte("week", 1)
                .lte("week", 18);

        if (picksError) throw picksError;


        const players = {};


        picks.forEach(pick => {

            const player =
                pick["player-name"];

            if (!player) return;


            if (!players[player]) {

                players[player] = {
                    wins: 0,
                    confidence: 0
                };
            }


            const game =
                games.find(
                    g =>
                        String(g.id) ===
                        String(pick.game_id)
                );


            if (!game) return;


            if (pickIsWin(pick, game)) {

                players[player].wins++;

                players[player].confidence +=
                    Number(pick.confidence) || 0;
            }

        });


        const standings =
            Object.entries(players)
                .map(([player, stats]) => ({
                    player,
                    wins: stats.wins,
                    confidence: stats.confidence
                }))
                .sort((a, b) => {

                    if (b.wins !== a.wins) {
                        return b.wins - a.wins;
                    }

                    if (
                        b.confidence !==
                        a.confidence
                    ) {
                        return (
                            b.confidence -
                            a.confidence
                        );
                    }

                    return a.player.localeCompare(
                        b.player
                    );
                });


        tbody.innerHTML = "";


        standings.forEach(
            (entry, index) => {

                const row =
                    document.createElement("tr");


                row.innerHTML = `
                    <td class="rank">
                        ${index + 1}
                    </td>

                    <td class="player">
                        ${entry.player}
                    </td>

                    <td>
                        ${entry.wins}
                    </td>

                    <td>
                        ${entry.confidence}
                    </td>
                `;


                tbody.appendChild(row);
            }
        );


        if (standings.length === 0) {

            tbody.innerHTML =
                `<tr>
                    <td colspan="4"
                        class="no-data">
                        No standings available yet.
                    </td>
                </tr>`;
        }


    } catch (error) {

        console.error(
            "Error loading season leaderboard:",
            error
        );


        tbody.innerHTML =
            `<tr>
                <td colspan="4"
                    class="no-data">
                    Error loading season standings.
                </td>
            </tr>`;
    }
}


/* =========================================================
   STARTUP
========================================================= */

async function loadAll() {

    await Promise.all([
        loadWeeklyWinners(),
        loadWinsByWeek(),
        loadSeasonLeaderboard()
    ]);
}


loadAll();


/* =========================================================
   AUTO REFRESH
========================================================= */

setInterval(() => {

    loadAll();

}, 60000);

</script>

</body>
</html>
