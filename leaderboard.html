<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body {

}

<body>


<header>

<h1>🏈 LamFam 2026-2027 Football Pool</h1>

<p>Leaderboard</p>

</header>


<main>


<!-- WEEKLY STANDINGS -->

<div class="card">

<h2>Weekly Standings</h2>

<h2 id="leaderboardTitle">
Week 1 Standings

Loading season standings...
</div>

<h2>🏆 Weekly Winners</h2>

<div id="weeklyWinners">
Loading weekly winners...
</div>

</div>


</main>


<script>


// ==================================================
// SUPABASE
// ==================================================

const SUPABASE_URL =
"https://bgkcnsnydchfghyhwurw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_CzYkbEOaBmQbXroYYOXDbA_6NX6kZLz";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// ==================================================
// NORMALIZE TEAM NAME
// ==================================================

function normalizeTeam(team) {

    if (!team) return "";

    return String(team)
        .trim()
        .toLowerCase()
        .replace(/\s+/g, " ");

}


// ==================================================
// DETERMINE IF GAME IS ACTUALLY COMPLETED
//
// A game is NOT considered completed simply because
// home_score and away_score contain numbers.
//
// The Winner field must contain an actual result.
//
// This prevents future games with 0-0 scores from
// being counted as wins.
// ==================================================

function isGameCompleted(game) {

    if (!game) {
        return false;
    }

    const winner =
        game.Winner;

    if (
        winner === null ||
        winner === undefined
    ) {
        return false;
    }

    const winnerText =
        String(winner).trim();

    if (
        winnerText === "" ||
        winnerText.toLowerCase() === "null" ||
        winnerText.toLowerCase() === "tbd"
    ) {
        return false;
    }

    return true;

}


// ==================================================
// GET SPREAD FOR A TEAM
//
// Expected format:
//
// team1 -3.5 / team2 +3.5
//
// or
//
// team1 +3.5 / team2 -3.5
// ==================================================

function getTeamSpread(spread, team) {

    if (!spread || !team) {
        return null;
    }

    const parts =
        String(spread).split("/");

    const target =
        normalizeTeam(team);

    for (const part of parts) {

        const match =
            part.trim().match(
                /([+-]\d+(?:\.\d+)?)\s*$/
            );

        if (!match) {
            continue;
        }

        const spreadNumber =
            Number(match[1]);

        const teamName =
            part
                .replace(
                    /([+-]\d+(?:\.\d+)?)\s*$/,
                    ""
                )
                .trim();

        if (
            normalizeTeam(teamName) ===
            target
        ) {

            return spreadNumber;

        }

    }

    return null;

}


// ==================================================
// DETERMINE IF PICK WON ATS
//
// Push counts as a win.
//
// IMPORTANT:
// A game MUST be completed before this function
// can return a win.
// ==================================================

function pickIsWin(pick, game) {

    if (!pick || !game) {
        return false;
    }


    // ------------------------------------------------
    // DO NOT COUNT UNFINISHED GAMES
    // ------------------------------------------------

    if (!isGameCompleted(game)) {

        return false;

    }


    const pickedTeam =
        pick["team-picked"];

    const spread =
        getTeamSpread(
            game.spread,
            pickedTeam
        );

    if (spread === null) {

        console.warn(
            "Could not determine spread for:",
            pickedTeam,
            game.spread
        );

        return false;

    }


    const homeScore =
        Number(game.home_score);

    const awayScore =
        Number(game.away_score);

    if (
        !Number.isFinite(homeScore) ||
        !Number.isFinite(awayScore)
    ) {

        return false;

    }


    let pickedScore;
    let opponentScore;

    const picked =
        normalizeTeam(pickedTeam);

    const team1 =
        normalizeTeam(game.team1);

    const team2 =
        normalizeTeam(game.team2);


    /*
       team1 is the AWAY team.
       team2 is the HOME team.
    */

    if (picked === team1) {

        pickedScore = awayScore;
        opponentScore = homeScore;

    } else if (picked === team2) {

        pickedScore = homeScore;
        opponentScore = awayScore;

    } else {

        console.warn(
            "Picked team does not match game:",
            pickedTeam,
            game.team1,
            game.team2
        );

        return false;

    }


    // ATS margin

    const atsResult =
        (pickedScore - opponentScore) + spread;


    /*
       Positive = covers
       Zero = push
       Negative = does not cover

       Push counts as a win.
    */

    return atsResult >= 0;

}


// ==================================================
// CREATE WEEK BUTTONS
//
// Completed weeks are crossed out automatically.
// They remain clickable.
// ==================================================

async function loadWeekButtons() {

    const container =
        document.getElementById("weekButtons");

    const {
        data: games,
        error
    } =
        await supabaseClient
            .from("games")
            .select("week,Winner")
            .gte("week", 1)
            .lte("week", 18);

    if (error) {

        console.error(
            "Error loading week status:",
            error
        );

        return;

    }

    container.innerHTML = "";


    for (
        let week = 1;
        week <= 18;
        week++
    ) {

        const weekGames =
            games.filter(
                game =>
                    Number(game.week) === week
            );


        /*
           A week is completed only when:

           1. It has games
           2. EVERY game has a valid Winner
        */

        const completed =
            weekGames.length > 0 &&
            weekGames.every(
                game =>
                    isGameCompleted(game)
            );


        const button =
            document.createElement("button");

        button.type = "button";

        button.className =
            "week-button" +
            (
                completed
                    ? " completed"
                    : ""
            );


        button.innerText =
            "Week " + week;


        button.onclick = () => {

            document
                .getElementById("weekSelect")
                .value = week;


            document
                .querySelectorAll(".week-button")
                .forEach(btn =>
                    btn.classList.remove(
                        "selected"
                    )
                );


            button.classList.add(
                "selected"
            );


            loadLeaderboard();

        };


        container.appendChild(button);

    }


    // Select Week 1 initially

    const firstButton =
        container.querySelector(
            ".week-button"
        );

    if (firstButton) {

        firstButton.classList.add(
            "selected"
        );

    }

}


// ==================================================
// LOAD WEEKLY LEADERBOARD
// ==================================================

async function loadLeaderboard() {

    const week =
        parseInt(
            document
                .getElementById("weekSelect")
                .value
        );

    const status =
        document.getElementById("status");

    const leaderboard =
        document.getElementById("leaderboard");


    status.className = "";

    status.innerText =
        "Loading scores...";

    leaderboard.innerHTML = "";


    // ==================================================
    // GET GAMES
    // ==================================================

    const {
        data: games,
        error: gamesError
    } =
        await supabaseClient

        .from("games")

        .select(
            "id,team1,team2,spread,home_team,game_time,Winner,home_score,away_score"
        )

        .eq("week", week);


    if (gamesError) {

        console.error(gamesError);

        status.className =
            "error";

        status.innerText =
            "Error loading games: " +
            gamesError.message;

        return;

    }


    // ==================================================
    // GET PICKS
    // ==================================================

    const {
        data: picks,
        error: picksError
    } =
        await supabaseClient

        .from("Picks")

        .select(
            "player-name,game_id,team-picked,confidence,week"
        )

        .eq("week", week);


    if (picksError) {

        console.error(picksError);

        status.className =
            "error";

        status.innerText =
            "Error loading picks: " +
            picksError.message;

        return;

    }


    if (
        !picks ||
        picks.length === 0
    ) {

        status.innerText =
            "No picks have been submitted for Week " +
            week +
            ".";

        return;

    }


    // ==================================================
    // GAME LOOKUP
    // ==================================================

    const gameMap = {};

    games.forEach(game => {

        gameMap[game.id] =
            game;

    });


    // ==================================================
    // PLAYER SCORES
    // ==================================================

    const scores = {};


    picks.forEach(pick => {

        const player =
            pick["player-name"];


        if (!scores[player]) {

            scores[player] = {

                score: 0,

                correct: 0,

                games: 0

            };

        }


        scores[player].games++;


        const game =
            gameMap[pick.game_id];


        if (!game) {

            return;

        }


        // USE ATS RESULT
        // Unfinished games automatically return false.

        if (
            pickIsWin(
                pick,
                game
            )
        ) {

            scores[player].score +=
                Number(pick.confidence);

            scores[player].correct++;

        }

    });


    // ==================================================
    // SORT BY WINS
    // ==================================================

    const players =
        Object.keys(scores);


    players.sort(
        (a, b) => {

            if (
                scores[b].correct !==
                scores[a].correct
            ) {

                return (
                    scores[b].correct -
                    scores[a].correct
                );

            }


            return (
                scores[b].score -
                scores[a].score
            );

        }
    );


    // ==================================================
    // DISPLAY
    // ==================================================

    document.getElementById(
        "leaderboardTitle"
    ).innerText =
        "Week " +
        week +
        " Standings";


    let html = `

<table>

<thead>

<tr>

<th>Rank</th>

<th>Player</th>

<th>Wins</th>

<th>Confidence Points</th>

</tr>

</thead>


<tbody>
`;


    players.forEach(
        (player, index) => {

            html += `

<tr>

<td class="rank">
${index + 1}
</td>

<td>
${player}
</td>

<td class="total">
${scores[player].correct}
</td>

<td>
${scores[player].score}
</td>

</tr>
`;

        }
    );


    html += `

</tbody>

</table>
`;


    leaderboard.innerHTML =
        html;


    status.className =
        "success";

    status.innerText =
        "Scores loaded successfully.";

}


// ==================================================
// SEASON STANDINGS
// ==================================================

async function loadSeasonLeaderboard() {

    const season =
        document.getElementById(
            "seasonLeaderboard"
        );


    // ==================================================
    // GET GAMES
    // ==================================================

    const {
        data: games,
        error: gamesError
    } =
        await supabaseClient

        .from("games")

        .select(
            "id,week,team1,team2,spread,home_team,game_time,Winner,home_score,away_score"
        )

        .gte("week", 1)

        .lte("week", 18);


    if (gamesError) {

        season.innerHTML =
            "<p class='error'>Unable to load season games.</p>";

        return;

    }


    // ==================================================
    // GET PICKS
    // ==================================================

    const {
        data: picks,
        error: picksError
    } =
        await supabaseClient

        .from("Picks")

        .select(
            "player-name,game_id,team-picked,confidence,week"
        )

        .gte("week", 1)

        .lte("week", 18);


    if (picksError) {

        season.innerHTML =
            "<p class='error'>Unable to load season picks.</p>";

        return;

    }


    if (
        !picks ||
        picks.length === 0
    ) {

        season.innerHTML =
            "<p>No season picks have been submitted yet.</p>";

        return;

    }


    // ==================================================
    // GAME LOOKUP
    // ==================================================

    const gameMap = {};

    games.forEach(game => {

        gameMap[game.id] =
            game;

    });


    // ==================================================
    // CALCULATE TOTALS
    // ==================================================

    const players = {};


    picks.forEach(pick => {

        const player =
            pick["player-name"];


        const game =
            gameMap[pick.game_id];


        if (!players[player]) {

            players[player] = {

                wins: 0,

                points: 0

            };

        }


        if (!game) {

            return;

        }


        // ONLY COMPLETED GAMES COUNT

        if (
            pickIsWin(
                pick,
                game
            )
        ) {

            players[player].wins++;

            players[player].points +=
                Number(pick.confidence);

        }

    });


    // ==================================================
    // SORT BY TOTAL WINS
    // ==================================================

    const names =
        Object.keys(players);


    names.sort(
        (a, b) => {

            if (
                players[b].wins !==
                players[a].wins
            ) {

                return (
                    players[b].wins -
                    players[a].wins
                );

            }


            return (
                players[b].points -
                players[a].points
            );

        }
    );


    // ==================================================
    // DISPLAY
    // ==================================================

    let html = `

<table>

<thead>

<tr>

<th>Rank</th>

<th>Player</th>

<th>Total Wins</th>

<th>Confidence Points</th>

</tr>

</thead>


<tbody>
`;


    names.forEach(
        (player, index) => {

            html += `

<tr>

<td class="rank">
${index + 1}
</td>

<td>
${player}
</td>

<td class="total">
${players[player].wins}
</td>

<td>
${players[player].points}
</td>

</tr>
`;

        }
    );


    html += `

</tbody>

</table>
`;


    season.innerHTML =
        html;

}


// ==================================================
// WEEKLY WINNERS
// ==================================================

async function loadWeeklyWinners() {

    const container =
        document.getElementById(
            "weeklyWinners"
        );


    // ==================================================
    // GET GAMES
    // ==================================================

    const {
        data: games,
        error: gamesError
    } =
        await supabaseClient

        .from("games")

        .select(
            "id,week,team1,team2,spread,home_team,game_time,Winner,home_score,away_score"
        )

        .gte("week", 1)

        .lte("week", 18);


    if (gamesError) {

        container.innerHTML =
            "<p class='error'>Unable to load weekly winners.</p>";

        return;

    }


    // ==================================================
    // GET PICKS
    // ==================================================

    const {
        data: picks,
        error: picksError
    } =
        await supabaseClient

        .from("Picks")

        .select(
            "player-name,game_id,team-picked,confidence,week"
        )

        .gte("week", 1)

        .lte("week", 18);


    if (picksError) {

        container.innerHTML =
            "<p class='error'>Unable to load weekly winners.</p>";

        return;

    }


    // ==================================================
    // GAME LOOKUP
    // ==================================================

    const gameMap = {};


    games.forEach(game => {

        gameMap[game.id] =
            game;

    });


    // ==================================================
    // CALCULATE WEEKLY POINTS
    // ==================================================

    const weekly = {};


    picks.forEach(pick => {

        const player =
            pick["player-name"];


        const game =
            gameMap[pick.game_id];


        if (!game) {

            return;

        }


        // ------------------------------------------------
        // IMPORTANT:
        // Ignore unfinished games completely.
        // ------------------------------------------------

        if (
            !isGameCompleted(game)
        ) {

            return;

        }


        const week =
            game.week;


        if (!weekly[week]) {

            weekly[week] = {};

        }


        if (
            !weekly[week][player]
        ) {

            weekly[week][player] = 0;

        }


        // SAME ATS LOGIC

        if (
            pickIsWin(
                pick,
                game
            )
        ) {

            weekly[week][player] +=
                Number(pick.confidence);

        }

    });


    // ==================================================
    // CREATE TABLE
    // ==================================================

    let rows = "";


    for (
        let week = 1;
        week <= 18;
        week++
    ) {


        // No completed games for this week

        if (!weekly[week]) {

            continue;

        }


        const players =
            Object.keys(
                weekly[week]
            );


        if (
            players.length === 0
        ) {

            continue;

        }


        let highest = 0;


        players.forEach(player => {

            if (
                weekly[week][player] >
                highest
            ) {

                highest =
                    weekly[week][player];

            }

        });


        const winners =
            players.filter(
                player =>
                    weekly[week][player] ===
                    highest
            );


        rows += `

<tr>

<td>
Week ${week}
</td>

<td class="winner">
${winners.join(", ")}
</td>

<td>
${highest}
</td>

</tr>
`;

    }


    // ==================================================
    // DISPLAY
    // ==================================================

    if (rows === "") {

        container.innerHTML =
            "<p>No weekly winners yet.</p>";

        return;

    }


    container.innerHTML = `

<table>

<thead>

<tr>

<th>Week</th>

<th>Winner</th>

<th>Confidence Points</th>

</tr>

</thead>


<tbody>

${rows}

</tbody>

</table>
`;

}


// ==================================================
// START
// ==================================================

loadWeekButtons();

loadLeaderboard();

loadSeasonLeaderboard();

loadWeeklyWinners();


// ==================================================
// AUTO REFRESH EVERY 60 SECONDS
// ==================================================

setInterval(() => {

    loadWeekButtons();

    loadLeaderboard();

    loadSeasonLeaderboard();

    loadWeeklyWinners();

}, 60000);


</script>
