
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LamFam Football Pool 2026-2027 Leaderboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f4f4f4;
    color: #111827;
}

header {
    background: #111827;
    color: white;
    text-align: center;
    padding: 25px 15px;
}

main {
    max-width: 750px;
    margin: 20px auto;
    padding: 15px;
}

.card {
    background: white;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 10px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

th, td {
    padding: 12px 8px;
    border-bottom: 1px solid #ddd;
    text-align: center;
}

th {
    background: #111827;
    color: white;
}

td:first-child,
th:first-child {
    text-align: left;
}

.rank {
    font-weight: bold;
}

.total {
    font-weight: bold;
    font-size: 18px;
}

.error {
    color: #dc2626;
    font-weight: bold;
}

.winner {
    font-weight: bold;
    font-size: 18px;
}

#winsByWeek {
    width: 100%;
    overflow-x: auto;
}

#winsByWeek table {
    min-width: 500px;
}

#winsByWeek th,
#winsByWeek td {
    white-space: nowrap;
}

</style>
</head>

<body>

<header>
    <h1>🏈 LamFam 2026-2027 Football Pool</h1>
    <p>Leaderboard</p>
</header>

<main>

<div class="card">
    <h2>🏆 Weekly Winners</h2>
    <div id="weeklyWinners">Loading weekly winners...</div>
</div>

<div class="card">
    <h2>📈 Wins by Week — Progression</h2>
    <div id="winsByWeek">Loading wins by week...</div>
</div>

<div class="card">
    <h2>🏆 Season Standings</h2>
    <div id="seasonLeaderboard">Loading season standings...</div>
</div>

</main>

<script>

// ==================================================
// SUPABASE
// ==================================================

const SUPABASE_URL =
"https://bgkcnsnydchfghyhwurw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_CzYkbEOaBmQbXroYYOXDbA_6NX6kZLz";

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// ==================================================
// LOAD ALL RECORDS IN BATCHES
// FIXES SUPABASE 1,000 RECORD LIMIT
// ==================================================

async function fetchAllRows(tableName, columns, orderColumns) {

    const batchSize = 1000;
    let allRows = [];
    let from = 0;

    while (true) {

        let query = supabaseClient
            .from(tableName)
            .select(columns);

        orderColumns.forEach(column => {
            query = query.order(column, {
                ascending: true
            });
        });

        const { data, error } = await query.range(
            from,
            from + batchSize - 1
        );

        if (error) {
            console.error(
                "Error loading " + tableName,
                error
            );
            throw error;
        }

        if (!data || data.length === 0) {
            break;
        }

        allRows = allRows.concat(data);

        if (data.length < batchSize) {
            break;
        }

        from += batchSize;
    }

    console.log(
        tableName + " records loaded:",
        allRows.length
    );

    return allRows;
}


// ==================================================
// LOAD GAMES AND PICKS
// ==================================================

async function loadAllData() {

    const [games, picks] = await Promise.all([

        fetchAllRows(
            "games",
            "id,week,team1,team2,spread,home_team,game_time,Winner,home_score,away_score",
            ["week", "id"]
        ),

        fetchAllRows(
            "Picks",
            "player-name,game_id,team-picked,confidence,week",
            ["week", "game_id", "player-name"]
        )

    ]);

    return {
        games,
        picks
    };
}


// ==================================================
// NORMALIZE TEAM NAME
// ==================================================

function normalizeTeam(team) {

    if (!team) return "";

    return String(team)
        .trim()
        .toLowerCase()
        .replace(/\s+/g, " ");

}


// ==================================================
// ESCAPE HTML
// ==================================================

function escapeHTML(value) {

    return String(value ?? "").replace(
        /[&<>"']/g,
        character => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
        })[character]
    );

}


// ==================================================
// DETERMINE IF GAME IS COMPLETED
// ==================================================

function isGameCompleted(game) {

    if (!game) return false;

    const winner = game.Winner;

    if (
        winner === null ||
        winner === undefined
    ) {
        return false;
    }

    const winnerText = String(winner).trim();

    if (
        winnerText === "" ||
        winnerText.toLowerCase() === "null" ||
        winnerText.toLowerCase() === "tbd"
    ) {
        return false;
    }

    return true;
}


// ==================================================
// GET SPREAD FOR A TEAM
// ==================================================

function getTeamSpread(spread, team) {

    if (!spread || !team) return null;

    const parts = String(spread).split("/");

    const target = normalizeTeam(team);

    for (const part of parts) {

        const match = part.trim().match(
            /([+-]\d+(?:\.\d+)?)\s*$/
        );

        if (!match) continue;

        const spreadNumber = Number(match[1]);

        const teamName = part
            .replace(
                /([+-]\d+(?:\.\d+)?)\s*$/,
                ""
            )
            .trim();

        if (normalizeTeam(teamName) === target) {
            return spreadNumber;
        }
    }

    return null;
}


// ==================================================
// DETERMINE IF PICK WON AGAINST THE SPREAD
// PUSH COUNTS AS A WIN
// ==================================================

function pickIsWin(pick, game) {

    if (!pick || !game) return false;

    if (!isGameCompleted(game)) return false;

    const pickedTeam = pick["team-picked"];

    const spread = getTeamSpread(
        game.spread,
        pickedTeam
    );

    if (spread === null) {

        console.warn(
            "Could not determine spread:",
            pickedTeam,
            game.spread
        );

        return false;
    }

    const homeScore = Number(game.home_score);
    const awayScore = Number(game.away_score);

    if (
        game.home_score === null ||
        game.away_score === null ||
        game.home_score === undefined ||
        game.away_score === undefined ||
        !Number.isFinite(homeScore) ||
        !Number.isFinite(awayScore)
    ) {
        return false;
    }

    let pickedScore;
    let opponentScore;

    const picked = normalizeTeam(pickedTeam);
    const team1 = normalizeTeam(game.team1);
    const team2 = normalizeTeam(game.team2);

    // team1 = AWAY
    // team2 = HOME

    if (picked === team1) {

        pickedScore = awayScore;
        opponentScore = homeScore;

    } else if (picked === team2) {

        pickedScore = homeScore;
        opponentScore = awayScore;

    } else {

        console.warn(
            "Team mismatch:",
            pickedTeam,
            game.team1,
            game.team2
        );

        return false;
    }

    const atsResult =
        (pickedScore - opponentScore) + spread;

    // A push counts as a win.

    return atsResult >= 0;
}


// ==================================================
// CREATE GAME LOOKUP
// ==================================================

function createGameMap(games) {

    const map = {};

    games.forEach(game => {
        map[String(game.id)] = game;
    });

    return map;
}


// ==================================================
// SEASON STANDINGS
// ==================================================

async function loadSeasonLeaderboard(games, picks) {

    const season = document.getElementById(
        "seasonLeaderboard"
    );

    const gameMap = createGameMap(games);

    const players = {};

    picks.forEach(pick => {

        const player = pick["player-name"];

        if (!player) return;

        if (!players[player]) {
            players[player] = {
                wins: 0,
                points: 0
            };
        }

        const game = gameMap[String(pick.game_id)];

        if (!game) return;

        if (pickIsWin(pick, game)) {

            players[player].wins++;

            players[player].points +=
                Number(pick.confidence) || 0;
        }
    });

    const names = Object.keys(players);

    names.sort((a, b) => {

        if (players[b].wins !== players[a].wins) {
            return players[b].wins - players[a].wins;
        }

        return players[b].points - players[a].points;

    });

    if (names.length === 0) {
        season.innerHTML = "<p>No player records found.</p>";
        return;
    }

    let html = `
    <table>
    <thead>
    <tr>
        <th>Rank</th>
        <th>Player</th>
        <th>Total Wins</th>
        <th>Confidence Points</th>
    </tr>
    </thead>
    <tbody>
    `;

    names.forEach((player, index) => {

        html += `
        <tr>
            <td class="rank">${index + 1}</td>
            <td>${escapeHTML(player)}</td>
            <td class="total">${players[player].wins}</td>
            <td>${players[player].points}</td>
        </tr>
        `;
    });

    html += `
    </tbody>
    </table>
    `;

    season.innerHTML = html;
}


// ==================================================
// WEEKLY WINNERS
// ==================================================

async function loadWeeklyWinners(games, picks) {

    const container = document.getElementById(
        "weeklyWinners"
    );

    const gameMap = createGameMap(games);

    const weekly = {};

    picks.forEach(pick => {

        const player = pick["player-name"];

        if (!player) return;

        const game = gameMap[String(pick.game_id)];

        if (!game || !isGameCompleted(game)) return;

        const week = Number(game.week);

        if (!weekly[week]) {
            weekly[week] = {};
        }

        if (!weekly[week][player]) {
            weekly[week][player] = 0;
        }

        if (pickIsWin(pick, game)) {

            weekly[week][player] +=
                Number(pick.confidence) || 0;
        }
    });

    let rows = "";

    for (let week = 1; week <= 18; week++) {

        if (!weekly[week]) continue;

        const players = Object.keys(weekly[week]);

        if (players.length === 0) continue;

        const highest = Math.max(
            ...players.map(player => weekly[week][player])
        );

        const winners = players.filter(
            player => weekly[week][player] === highest
        );

        rows += `
        <tr>
            <td>Week ${week}</td>
            <td class="winner">
                ${winners.map(escapeHTML).join(", ")}
            </td>
            <td>${highest}</td>
        </tr>
        `;
    }

    if (rows === "") {

        container.innerHTML =
            "<p>No weekly winners yet.</p>";

        return;
    }

    container.innerHTML = `
    <table>
    <thead>
    <tr>
        <th>Week</th>
        <th>Winner</th>
        <th>Confidence Points</th>
    </tr>
    </thead>
    <tbody>
        ${rows}
    </tbody>
    </table>
    `;
}


// ==================================================
// WINS BY WEEK — PROGRESSION
// ==================================================

async function loadWinsByWeek(games, picks) {

    const container = document.getElementById(
        "winsByWeek"
    );

    const gameMap = createGameMap(games);

    // Find weeks that have completed games.

    const completedWeeks = [];

    for (let week = 1; week <= 18; week++) {

        const hasCompletedGame = games.some(
            game =>
                Number(game.week) === week &&
                isGameCompleted(game)
        );

        if (hasCompletedGame) {
            completedWeeks.push(week);
        }
    }

    if (completedWeeks.length === 0) {

        container.innerHTML =
            "<p>No completed games yet.</p>";

        return;
    }

    // Get all players.

    const playerNames = [];

    picks.forEach(pick => {

        const name = pick["player-name"];

        if (
            name &&
            !playerNames.includes(name)
        ) {
            playerNames.push(name);
        }
    });

    // Initialize player totals.

    const playerData = {};

    playerNames.forEach(name => {

        playerData[name] = {};

        for (let week = 1; week <= 18; week++) {
            playerData[name][week] = 0;
        }
    });

    // Count wins using the actual game week.

    picks.forEach(pick => {

        const player = pick["player-name"];

        if (!player || !playerData[player]) return;

        const game = gameMap[String(pick.game_id)];

        if (!game) return;

        const week = Number(game.week);

        if (!completedWeeks.includes(week)) return;

        if (!isGameCompleted(game)) return;

        if (pickIsWin(pick, game)) {

            playerData[player][week]++;
        }
    });

    // Sort players by total wins.

    playerNames.sort((a, b) => {

        const totalA = completedWeeks.reduce(
            (sum, week) =>
                sum + playerData[a][week],
            0
        );

        const totalB = completedWeeks.reduce(
            (sum, week) =>
                sum + playerData[b][week],
            0
        );

        return totalB - totalA;
    });

    // Build table.

    let html = `
    <div style="overflow-x:auto;width:100%;">
    <table>
    <thead>
    <tr>
        <th>Player</th>
    `;

    completedWeeks.forEach(week => {

        html += `<th>Wk ${week}</th>`;
    });

    html += `<th>Total</th></tr></thead><tbody>`;

    playerNames.forEach(player => {

        let total = 0;

        html += `
        <tr>
            <td><strong>${escapeHTML(player)}</strong></td>
        `;

        completedWeeks.forEach(week => {

            const wins = playerData[player][week];

            total += wins;

            html += `<td>${wins}</td>`;
        });

        html += `
            <td class="total">${total}</td>
        </tr>
        `;
    });

    html += `
    </tbody>
    </table>
    </div>
    `;

    container.innerHTML = html;
}


// ==================================================
// REFRESH ALL LEADERBOARD SECTIONS
// ==================================================

let isLoading = false;

async function loadLeaderboard() {

    if (isLoading) return;

    isLoading = true;

    try {

        const {
            games,
            picks
        } = await loadAllData();

        console.log("Total games:", games.length);
        console.log("Total picks:", picks.length);

        await Promise.all([

            loadWeeklyWinners(games, picks),

            loadWinsByWeek(games, picks),

            loadSeasonLeaderboard(games, picks)

        ]);

    } catch (error) {

        console.error(
            "Leaderboard loading error:",
            error
        );

        document.getElementById(
            "weeklyWinners"
        ).innerHTML =
            "<p class='error'>Unable to load weekly winners.</p>";

        document.getElementById(
            "winsByWeek"
        ).innerHTML =
            "<p class='error'>Unable to load wins by week.</p>";

        document.getElementById(
            "seasonLeaderboard"
        ).innerHTML =
            "<p class='error'>Unable to load season standings.</p>";

    } finally {

        isLoading = false;
    }
}


// ==================================================
// START
// ==================================================

loadLeaderboard();


// ==================================================
// AUTO REFRESH EVERY 60 SECONDS
// ==================================================

setInterval(() => {

    loadLeaderboard();

}, 60000);

</script>

</body>
</html>
