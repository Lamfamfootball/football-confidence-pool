<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>LamFam Football Pool 2026-2027 Leaderboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f4f4f4;
    color: #111827;
}

header {
    background: #111827;
    color: white;
    text-align: center;
    padding: 25px 15px;
}

main {
    max-width: 750px;
    margin: 20px auto;
    padding: 15px;
}

.card {
    background: white;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 10px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

th,
td {
    padding: 12px 8px;
    border-bottom: 1px solid #ddd;
    text-align: center;
}

th {
    background: #111827;
    color: white;
}

td:first-child,
th:first-child {
    text-align: left;
}

.rank {
    font-weight: bold;
}

.total {
    font-weight: bold;
    font-size: 18px;
}

.error {
    color: #dc2626;
}

.winner {
    font-weight: bold;
    font-size: 18px;
}

</style>

</head>


<body>


<header>

<h1>🏈 LamFam 2026-2027 Football Pool</h1>

<p>Leaderboard</p>

</header>


<main>


<!-- WEEKLY WINNERS -->

<div class="card">

<h2>🏆 Weekly Winners</h2>

<div id="weeklyWinners">
Loading weekly winners...
</div>

</div>


<!-- SEASON STANDINGS -->

<div class="card">

<h2>🏆 Season Standings</h2>

<div id="seasonLeaderboard">
Loading season standings...
</div>

</div>


</main>


<script>


// ==================================================
// SUPABASE
// ==================================================

const SUPABASE_URL =
"https://bgkcnsnydchfghyhwurw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_CzYkbEOaBmQbXroYYOXDbA_6NX6kZLz";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// ==================================================
// NORMALIZE TEAM NAME
// ==================================================

function normalizeTeam(team) {

    if (!team) return "";

    return String(team)
        .trim()
        .toLowerCase()
        .replace(/\s+/g, " ");

}


// ==================================================
// DETERMINE IF GAME IS ACTUALLY COMPLETED
// ==================================================

function isGameCompleted(game) {

    if (!game) {
        return false;
    }

    const winner =
        game.Winner;

    if (
        winner === null ||
        winner === undefined
    ) {
        return false;
    }

    const winnerText =
        String(winner).trim();

    if (
        winnerText === "" ||
        winnerText.toLowerCase() === "null" ||
        winnerText.toLowerCase() === "tbd"
    ) {
        return false;
    }

    return true;

}


// ==================================================
// GET SPREAD FOR A TEAM
// ==================================================

function getTeamSpread(spread, team) {

    if (!spread || !team) {
        return null;
    }

    const parts =
        String(spread).split("/");

    const target =
        normalizeTeam(team);

    for (const part of parts) {

        const match =
            part.trim().match(
                /([+-]\d+(?:\.\d+)?)\s*$/
            );

        if (!match) {
            continue;
        }

        const spreadNumber =
            Number(match[1]);

        const teamName =
            part
                .replace(
                    /([+-]\d+(?:\.\d+)?)\s*$/,
                    ""
                )
                .trim();

        if (
            normalizeTeam(teamName) ===
            target
        ) {

            return spreadNumber;

        }

    }

    return null;

}


// ==================================================
// DETERMINE IF PICK WON ATS
// ==================================================

function pickIsWin(pick, game) {

    if (!pick || !game) {
        return false;
    }

    if (!isGameCompleted(game)) {
        return false;
    }

    const pickedTeam =
        pick["team-picked"];

    const spread =
        getTeamSpread(
            game.spread,
            pickedTeam
        );

    if (spread === null) {

        console.warn(
            "Could not determine spread for:",
            pickedTeam,
            game.spread
        );

        return false;

    }

    const homeScore =
        Number(game.home_score);

    const awayScore =
        Number(game.away_score);

    if (
        !Number.isFinite(homeScore) ||
        !Number.isFinite(awayScore)
    ) {

        return false;

    }

    let pickedScore;
    let opponentScore;

    const picked =
        normalizeTeam(pickedTeam);

    const team1 =
        normalizeTeam(game.team1);

    const team2 =
        normalizeTeam(game.team2);


    /*
       team1 is the AWAY team.
       team2 is the HOME team.
    */

    if (picked === team1) {

        pickedScore = awayScore;
        opponentScore = homeScore;

    } else if (picked === team2) {

        pickedScore = homeScore;
        opponentScore = awayScore;

    } else {

        console.warn(
            "Picked team does not match game:",
            pickedTeam,
            game.team1,
            game.team2
        );

        return false;

    }


    const atsResult =
        (pickedScore - opponentScore) + spread;


    /*
       Positive = covers
       Zero = push
       Negative = does not cover

       Push counts as a win.
    */

    return atsResult >= 0;

}


// ==================================================
// SEASON STANDINGS
// ==================================================

async function loadSeasonLeaderboard() {

    const season =
        document.getElementById(
            "seasonLeaderboard"
        );


    const {
        data: games,
        error: gamesError
    } =
        await supabaseClient

        .from("games")

        .select(
            "id,week,team1,team2,spread,home_team,game_time,Winner,home_score,away_score"
        )

        .gte("week", 1)

        .lte("week", 18);


    if (gamesError) {

        season.innerHTML =
            "<p class='error'>Unable to load season games.</p>";

        return;

    }


    const {
        data: picks,
        error: picksError
    } =
        await supabaseClient

        .from("Picks")

        .select(
            "player-name,game_id,team-picked,confidence,week"
        )

        .gte("week", 1)

        .lte("week", 18);


    if (picksError) {

        season.innerHTML =
            "<p class='error'>Unable to load season picks.</p>";

        return;

    }


    if (
        !picks ||
        picks.length === 0
    ) {

        season.innerHTML =
            "<p>No season picks have been submitted yet.</p>";

        return;

    }


    const gameMap = {};

    games.forEach(game => {

        gameMap[game.id] =
            game;

    });


    const players = {};


    picks.forEach(pick => {

        const player =
            pick["player-name"];


        const game =
            gameMap[pick.game_id];


        if (!players[player]) {

            players[player] = {

                wins: 0,

                points: 0

            };

        }


        if (!game) {
            return;
        }


        if (
            pickIsWin(
                pick,
                game
            )
        ) {

            players[player].wins++;

            players[player].points +=
                Number(pick.confidence);

        }

    });


    const names =
        Object.keys(players);


    names.sort(
        (a, b) => {

            if (
                players[b].wins !==
                players[a].wins
            ) {

                return (
                    players[b].wins -
                    players[a].wins
                );

            }


            return (
                players[b].points -
                players[a].points
            );

        }
    );


    let html = `

<table>

<thead>

<tr>

<th>Rank</th>

<th>Player</th>

<th>Total Wins</th>

<th>Confidence Points</th>

</tr>

</thead>

<tbody>
`;


    names.forEach(
        (player, index) => {

            html += `

<tr>

<td class="rank">
${index + 1}
</td>

<td>
${player}
</td>

<td class="total">
${players[player].wins}
</td>

<td>
${players[player].points}
</td>

</tr>
`;

        }
    );


    html += `

</tbody>

</table>
`;


    season.innerHTML =
        html;

}


// ==================================================
// WEEKLY WINNERS
// ==================================================

async function loadWeeklyWinners() {

    const container =
        document.getElementById(
            "weeklyWinners"
        );


    const {
        data: games,
        error: gamesError
    } =
        await supabaseClient

        .from("games")

        .select(
            "id,week,team1,team2,spread,home_team,game_time,Winner,home_score,away_score"
        )

        .gte("week", 1)

        .lte("week", 18);


    if (gamesError) {

        container.innerHTML =
            "<p class='error'>Unable to load weekly winners.</p>";

        return;

    }


    const {
        data: picks,
        error: picksError
    } =
        await supabaseClient

        .from("Picks")

        .select(
            "player-name,game_id,team-picked,confidence,week"
        )

        .gte("week", 1)

        .lte("week", 18);


    if (picksError) {

        container.innerHTML =
            "<p class='error'>Unable to load weekly winners.</p>";

        return;

    }


    const gameMap = {};


    games.forEach(game => {

        gameMap[game.id] =
            game;

    });


    const weekly = {};


    picks.forEach(pick => {

        const player =
            pick["player-name"];


        const game =
            gameMap[pick.game_id];


        if (!game) {
            return;
        }


        if (
            !isGameCompleted(game)
        ) {

            return;

        }


        const week =
            game.week;


        if (!weekly[week]) {

            weekly[week] = {};

        }


        if (
            !weekly[week][player]
        ) {

            weekly[week][player] = 0;

        }


        if (
            pickIsWin(
                pick,
                game
            )
        ) {

            weekly[week][player] +=
                Number(pick.confidence);

        }

    });


    let rows = "";


    for (
        let week = 1;
        week <= 18;
        week++
    ) {


        if (!weekly[week]) {
            continue;
        }


        const players =
            Object.keys(
                weekly[week]
            );


        if (
            players.length === 0
        ) {

            continue;

        }


        let highest = 0;


        players.forEach(player => {

            if (
                weekly[week][player] >
                highest
            ) {

                highest =
                    weekly[week][player];

            }

        });


        const winners =
            players.filter(
                player =>
                    weekly[week][player] ===
                    highest
            );


        rows += `

<tr>

<td>
Week ${week}
</td>

<td class="winner">
${winners.join(", ")}
</td>

<td>
${highest}
</td>

</tr>
`;

    }


    if (rows === "") {

        container.innerHTML =
            "<p>No weekly winners yet.</p>";

        return;

    }


    container.innerHTML = `

<table>

<thead>

<tr>

<th>Week</th>

<th>Winner</th>

<th>Confidence Points</th>

</tr>

</thead>

<tbody>

${rows}

</tbody>

</table>
`;

}


// ==================================================
// START
// ==================================================

loadWeeklyWinners();

loadSeasonLeaderboard();


// ==================================================
// AUTO REFRESH EVERY 60 SECONDS
// ==================================================

setInterval(() => {

    loadWeeklyWinners();

    loadSeasonLeaderboard();

}, 60000);


</script>


</body>

</html>
