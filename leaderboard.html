<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LamFam Football Pool Leaderboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body {
font-family: Arial, sans-serif;
margin: 0;
background: #f4f4f4;
color: #111827;
}

header {
background: #111827;
color: white;
text-align: center;
padding: 25px 15px;
}

main {
max-width: 750px;
margin: 20px auto;
padding: 15px;
}

.card {
background: white;
padding: 20px;
margin-bottom: 20px;
border-radius: 10px;
box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

select {
width: 100%;
padding: 10px;
margin: 8px 0 15px;
box-sizing: border-box;
border: 1px solid #ccc;
border-radius: 6px;
font-size: 16px;
}

button {
width: 100%;
padding: 13px;
border: none;
border-radius: 7px;
background: #2563eb;
color: white;
font-size: 17px;
cursor: pointer;
}

button:hover {
opacity: 0.9;
}

table {
width: 100%;
border-collapse: collapse;
margin-top: 15px;
}

th,
td {
padding: 12px 8px;
border-bottom: 1px solid #ddd;
text-align: center;
}

th {
background: #111827;
color: white;
}

td:first-child,
th:first-child {
text-align: left;
}

.rank {
font-weight: bold;
}

.total {
font-weight: bold;
font-size: 18px;
}

#status {
font-weight: bold;
}

.success {
color: #15803d;
}

.error {
color: #dc2626;
}

</style>
</head>

<body>

<header>

<h1>🏈 LamFam Football Pool</h1>

<p>Leaderboard</p>

</header>


<main>

<!-- WEEKLY LEADERBOARD -->

<div class="card">

<h2>Weekly Standings</h2>

<select id="weekSelect">

<option value="1">Week 1</option>
<option value="2">Week 2</option>
<option value="3">Week 3</option>
<option value="4">Week 4</option>
<option value="5">Week 5</option>
<option value="6">Week 6</option>
<option value="7">Week 7</option>
<option value="8">Week 8</option>
<option value="9">Week 9</option>
<option value="10">Week 10</option>
<option value="11">Week 11</option>
<option value="12">Week 12</option>
<option value="13">Week 13</option>
<option value="14">Week 14</option>
<option value="15">Week 15</option>
<option value="16">Week 16</option>
<option value="17">Week 17</option>
<option value="18">Week 18</option>

</select>

<button
type="button"
onclick="loadLeaderboard()"
>
Load Week
</button>

<p id="status">
Loading...
</p>

</div>


<div class="card">

<h2 id="leaderboardTitle">
Week 1 Standings
</h2>

<div id="leaderboard"></div>

</div>


<!-- SEASON LEADERBOARD -->

<div class="card">

<h2>🏆 Season Standings</h2>

<div id="seasonLeaderboard">
Loading season standings...
</div>

</div>

</main>


<script>

// ==================================================
// SUPABASE
// ==================================================

const SUPABASE_URL =
"https://bgkcnsnydchfghyhwurw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_CzYkbEOaBmQbXroYYOXDbA_6NX6kZLz";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


// ==================================================
// LOAD WEEKLY LEADERBOARD
// ==================================================

async function loadLeaderboard() {

const week =
parseInt(
document.getElementById(
"weekSelect"
).value
);

const status =
document.getElementById(
"status"
);

const leaderboard =
document.getElementById(
"leaderboard"
);

status.className = "";

status.innerText =
"Loading scores...";

leaderboard.innerHTML = "";


// Get games

const { data: games, error: gamesError } =
await supabaseClient
.from("games")
.select("id,Winner")
.eq("week", week);

if (gamesError) {

console.error(gamesError);

status.className =
"error";

status.innerText =
"Error loading games: " +
gamesError.message;

return;

}


// Get picks

const { data: picks, error: picksError } =
await supabaseClient
.from("Picks")
.select(
"player-name,game_id,team-picked,confidence,week"
)
.eq("week", week);

if (picksError) {

console.error(picksError);

status.className =
"error";

status.innerText =
"Error loading picks: " +
picksError.message;

return;

}


if (!picks || picks.length === 0) {

status.innerText =
"No picks have been submitted for Week " +
week +
".";

return;

}


// Calculate scores

const scores = {};

const gameMap = {};

games.forEach(game => {

gameMap[game.id] =
game.Winner;

});


picks.forEach(pick => {

const player =
pick["player-name"];

if (!scores[player]) {

scores[player] = {

score: 0,

correct: 0,

games: 0

};

}

scores[player].games++;

const winner =
gameMap[pick.game_id];

if (
winner &&
pick["team-picked"] === winner
) {

scores[player].score +=
Number(pick.confidence);

scores[player].correct++;

}

});


// Sort by correct picks first

const players =
Object.keys(scores);

players.sort(
(a, b) => {

if (
scores[b].correct !==
scores[a].correct
) {

return (
scores[b].correct -
scores[a].correct
);

}

return (
scores[b].score -
scores[a].score
);

});


// Display weekly leaderboard

document.getElementById(
"leaderboardTitle"
).innerText =
"Week " +
week +
" Standings";

let html = `

<table>

<thead>

<tr>

<th>Rank</th>
<th>Player</th>
<th>Wins</th>
<th>Confidence Points</th>

</tr>

</thead>

<tbody>

`;

players.forEach(
(player, index) => {

html += `

<tr>

<td class="rank">
${index + 1}
</td>

<td>
${player}
</td>

<td class="total">
${scores[player].correct}
</td>

<td>
${scores[player].score}
</td>

</tr>

`;

});

html += `

</tbody>

</table>

`;

leaderboard.innerHTML =
html;

status.className =
"success";

status.innerText =
"Scores loaded successfully.";

}


// ==================================================
// LOAD SEASON LEADERBOARD
// ==================================================

async function loadSeasonLeaderboard() {

const season =
document.getElementById(
"seasonLeaderboard"
);


// Get all games

const { data: games, error: gamesError } =
await supabaseClient
.from("games")
.select("id,week,Winner")
.gte("week", 1)
.lte("week", 18);

if (gamesError) {

console.error(gamesError);

season.innerHTML =
"<p class='error'>Unable to load season games.</p>";

return;

}


// Get only picks that have a valid week

const { data: picks, error: picksError } =
await supabaseClient
.from("Picks")
.select(
"player-name,game_id,team-picked,confidence,week"
)
.gte("week", 1)
.lte("week", 18);

if (picksError) {

console.error(picksError);

season.innerHTML =
"<p class='error'>Unable to load season picks.</p>";

return;

}


if (!picks || picks.length === 0) {

season.innerHTML =
"<p>No season picks have been submitted yet.</p>";

return;

}


// Create game lookup

const gameMap = {};

games.forEach(game => {

gameMap[game.id] = {

week: game.week,

winner: game.Winner

};

});


// Calculate season wins

const players = {};


picks.forEach(pick => {

const player =
pick["player-name"];

const game =
gameMap[pick.game_id];

if (!game) {
return;
}

if (!players[player]) {

players[player] = {

wins: 0,

points: 0

};

}


if (
game.winner &&
pick["team-picked"] ===
game.winner
) {

players[player].wins++;

players[player].points +=
Number(pick.confidence);

}

});


// Sort by total wins

const names =
Object.keys(players);

names.sort(
(a, b) => {

if (
players[b].wins !==
players[a].wins
) {

return (
players[b].wins -
players[a].wins
);

}

return (
players[b].points -
players[a].points
);

});


// Display

let html = `

<table>

<thead>

<tr>

<th>Rank</th>
<th>Player</th>
<th>Total Wins</th>
<th>Confidence Points</th>

</tr>

</thead>

<tbody>

`;

names.forEach(
(player, index) => {

html += `

<tr>

<td class="rank">
${index + 1}
</td>

<td>
${player}
</td>

<td class="total">
${players[player].wins}
</td>

<td>
${players[player].points}
</td>

</tr>

`;

});

html += `

</tbody>

</table>

`;

season.innerHTML =
html;

}


// ==================================================
// START
// ==================================================

loadLeaderboard();

loadSeasonLeaderboard();

</script>

</body>
</html>
