<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LamFam Admin — Set Games and Results</title>

<style>

body {
margin: 0;
font-family: Arial, sans-serif;
background: #eaf6ff;
color: #123047;
}

header {
background: #b9e3ff;
color: #123047;
text-align: center;
padding: 25px 15px;
border-bottom: 3px solid #8dccf5;
}

header h1 {
margin: 0;
font-size: 28px;
}

header p {
margin-bottom: 0;
}

main {
max-width: 800px;
margin: 25px auto;
padding: 15px;
}

.card {
background: white;
border-radius: 12px;
padding: 25px;
margin-bottom: 20px;
box-shadow: 0 3px 12px rgba(50,100,130,0.12);
border: 1px solid #c9e9fa;
}

h2 {
color: #17618a;
}

input,
select {
width: 100%;
padding: 12px;
margin: 6px 0 15px;
box-sizing: border-box;
border: 1px solid #a9d6ed;
border-radius: 7px;
font-size: 16px;
background: #f8fcff;
color: #123047;
}

input:focus,
select:focus {
outline: none;
border-color: #5bb7e8;
box-shadow: 0 0 0 2px #d7f1ff;
}

button {
padding: 12px 18px;
border: none;
border-radius: 7px;
cursor: pointer;
font-size: 16px;
margin-top: 10px;
}

.save {
background: #4aa9d8;
color: white;
width: 100%;
}

.save:hover {
background: #318fbe;
}

.game {
background: #f2faff;
border: 1px solid #c5e7f7;
border-radius: 10px;
padding: 18px;
margin: 15px 0;
}

.game h3 {
margin-top: 0;
color: #17618a;
}

.matchup {
font-size: 18px;
font-weight: bold;
margin: 8px 0 15px;
}

.home-team {
color: #17618a;
}

.home-icon {
font-size: 18px;
margin-right: 4px;
}

.info {
background: #e5f5ff;
border: 1px solid #c1e5f5;
padding: 10px;
border-radius: 7px;
margin-bottom: 12px;
}

.home {
color: #17618a;
font-weight: bold;
}

.time {
color: #246b94;
font-weight: bold;
}

.spread-row {
display: flex;
align-items: center;
gap: 12px;
margin: 8px 0;
}

.spread-team {
flex: 1;
font-weight: bold;
}

.spread-input {
width: 100px;
margin: 0;
text-align: center;
font-weight: bold;
}

.score-row {
display: flex;
align-items: center;
gap: 12px;
margin: 10px 0;
}

.score-team {
flex: 1;
font-weight: bold;
}

.score-input {
width: 90px;
margin: 0;
text-align: center;
font-weight: bold;
font-size: 18px;
}

.result-winner {
background: #dcfce7;
border: 1px solid #86efac;
color: #166534;
padding: 10px;
border-radius: 7px;
font-weight: bold;
margin-top: 12px;
}

#message,
#resultsMessage {
font-weight: bold;
color: #17618a;
}

hr {
margin: 30px 0;
border: 0;
border-top: 2px solid #c9e9fa;
}

</style>
</head>

<body>

<header>

<h1>🏈 LamFam Admin</h1>

<p>
Set up weekly football games and enter results
</p>

</header>

<main>

<div class="card">

<h2>📅 Week Setup</h2>

<label>
<strong>Week Number</strong>
</label>

<input
type="number"
id="week"
value="1"
min="1"
max="18"
>

<button
type="button"
class="save"
onclick="loadWeekGames()"
>
Load Week Games
</button>

<div id="games"></div>

<button
type="button"
class="save"
onclick="saveWeek()"
>
Save Week
</button>

<p id="message"></p>

<hr>

<h2>🏆 Game Results</h2>

<label>
<strong>Results Week</strong>
</label>

<input
type="number"
id="resultsWeek"
value="1"
min="1"
max="18"
>

<button
type="button"
class="save"
onclick="loadResults()"
>
Load Games
</button>

<p id="resultsMessage"></p>

<div id="results"></div>

<button
type="button"
class="save"
onclick="saveResults()"
>
Save Results
</button>

</div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://bgkcnsnydchfghyhwurw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_CzYkbEOaBmQbXroYYOXDbA_6NX6kZLz";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let loadedGames = [];


// ==================================================
// PARSE EXISTING SPREAD
// ==================================================

function parseSpread(spread, team1, team2) {

if (!spread) {

return {
team1: "",
team2: ""
};

}

const parts =
spread.split("/");

let team1Spread = "";
let team2Spread = "";

parts.forEach(
part => {

part = part.trim();

if (
part.startsWith(team1)
) {

team1Spread =
part.substring(team1.length).trim();

}

if (
part.startsWith(team2)
) {

team2Spread =
part.substring(team2.length).trim();

}

});

return {
team1: team1Spread,
team2: team2Spread
};

}


// ==================================================
// FORMAT SPREAD
// ==================================================

function formatSpread(
team1,
team1Spread,
team2,
team2Spread
) {

team1Spread =
team1Spread.trim();

team2Spread =
team2Spread.trim();

if (
team1Spread &&
!team1Spread.startsWith("+") &&
!team1Spread.startsWith("-")
) {

team1Spread =
"+" + team1Spread;

}

if (
team2Spread &&
!team2Spread.startsWith("+") &&
!team2Spread.startsWith("-")
) {

team2Spread =
"+" + team2Spread;

}

if (
!team1Spread &&
!team2Spread
) {

return "";

}

return (
team1 +
" " +
team1Spread +
" / " +
team2 +
" " +
team2Spread
);

}


// ==================================================
// LOAD WEEK GAMES
// ==================================================

async function loadWeekGames() {

const week =
parseInt(
document.getElementById("week").value
);

const message =
document.getElementById("message");

const gamesContainer =
document.getElementById("games");

message.innerText =
"Loading Week " +
week +
" games...";

gamesContainer.innerHTML = "";

loadedGames = [];

try {

const {
data: games,
error
} =
await supabaseClient
.from("games")
.select(
"id,week,team1,team2,spread,home_team,game_time"
)
.eq(
"week",
week
)
.order(
"game_time",
{
ascending: true,
nullsFirst: false
}
)
.order(
"id",
{
ascending: true
}
);

if (error) {
throw error;
}

if (
!games ||
games.length === 0
) {

message.innerText =
"No games found for Week " +
week +
".";

return;

}

loadedGames =
games;

games.forEach(
(game,index) => {

const number =
index + 1;

const gameDiv =
document.createElement("div");

gameDiv.className =
"game";

const gameTime =
game.game_time
?
new Date(
game.game_time
).toLocaleString(
"en-US",
{
weekday: "short",
month: "short",
day: "numeric",
hour: "numeric",
minute: "2-digit"
}
)
:
"Not entered";

const parsed =
parseSpread(
game.spread,
game.team1,
game.team2
);

gameDiv.innerHTML = `

<h3>
Game ${number}
</h3>

<div class="matchup">

${game.team1}

@

<span class="home-team">
<span class="home-icon">🏠</span>
${game.team2}
</span>

</div>

<div class="info home">
🏠 Home:
${game.home_team || game.team2}
</div>

<div class="info time">
🕒 Game Time:
${gameTime}
</div>

<div class="spread-row">

<div class="spread-team">
${game.team1}
</div>

<input
class="spread-input"
type="text"
id="spread1-${game.id}"
value="${parsed.team1}"
placeholder="+3.5"
>

</div>

<div class="spread-row">

<div class="spread-team">
🏠 ${game.team2}
</div>

<input
class="spread-input"
type="text"
id="spread2-${game.id}"
value="${parsed.team2}"
placeholder="-3.5"
>

</div>

`;

gamesContainer.appendChild(
gameDiv
);

});

message.innerText =
"Week " +
week +
" loaded. Enter or review the spreads, then click Save Week.";

}

catch (error) {

console.error(
"Load Week Games error:",
error
);

message.innerText =
"Error loading games: " +
error.message;

}

}


// ==================================================
// SAVE WEEK
// ==================================================

async function saveWeek() {

const week =
parseInt(
document.getElementById("week").value
);

const message =
document.getElementById("message");

message.innerText =
"Saving Week " +
week +
"...";

if (
!loadedGames ||
loadedGames.length === 0
) {

message.innerText =
"Please load the week first.";

return;

}

try {

let savedCount = 0;

for (
const game of loadedGames
) {

const spread1Input =
document.getElementById(
"spread1-" + game.id
);

const spread2Input =
document.getElementById(
"spread2-" + game.id
);

const spread =
formatSpread(
game.team1,
spread1Input
?
spread1Input.value
:
"",
game.team2,
spread2Input
?
spread2Input.value
:
""
);

const {
error
} =
await supabaseClient
.from("games")
.update({
spread: spread
})
.eq(
"id",
game.id
);

if (error) {
throw error;
}

savedCount++;

}

message.innerText =
"✅ Week " +
week +
" saved successfully! " +
savedCount +
" spreads updated.";

}

catch (error) {

console.error(
"Save Week error:",
error
);

message.innerText =
"Error saving Week " +
week +
": " +
error.message;

}

}


// ==================================================
// LOAD RESULTS
// ==================================================

async function loadResults() {

const week =
parseInt(
document.getElementById(
"resultsWeek"
).value
);

const resultsContainer =
document.getElementById(
"results"
);

const message =
document.getElementById(
"resultsMessage"
);

resultsContainer.innerHTML = "";

message.innerText =
"Loading games...";

try {

const {
data: games,
error
} =
await supabaseClient
.from("games")
.select(
"id,team1,team2,home_team,spread,game_time,Winner,home_score,away_score"
)
.eq(
"week",
week
)
.order(
"game_time",
{
ascending: true,
nullsFirst: false
}
)
.order(
"id",
{
ascending: true
}
);

if (error) {
throw error;
}

if (
!games ||
games.length === 0
) {

message.innerText =
"No games found for Week " +
week +
".";

return;

}

games.forEach(
game => {

const gameDiv =
document.createElement("div");

gameDiv.className =
"game";

const gameTime =
game.game_time
?
new Date(
game.game_time
).toLocaleString(
"en-US",
{
weekday: "short",
month: "short",
day: "numeric",
hour: "numeric",
minute: "2-digit"
}
)
:
"Not entered";

let winnerText = "";

if (game.Winner) {

winnerText =
`
<div class="result-winner">
🏆 Winner: ${game.Winner}
</div>
`;

}

gameDiv.innerHTML = `

<h3>

${game.team1}

@

<span class="home-team">
<span class="home-icon">🏠</span>
${game.team2}
</span>

</h3>

<div class="info home">

🏠 Home:
${game.home_team || game.team2}

</div>

<p>

<strong>Game Time:</strong>
${gameTime}

</p>

<p>

<strong>Spread:</strong>
${game.spread || "Not entered"}

</p>

<div class="score-row">

<div class="score-team">
${game.team1}
</div>

<input
class="score-input"
type="number"
min="0"
id="away-score-${game.id}"
value="${
game.away_score !== null
?
game.away_score
:
""
}"
placeholder="0"
>

</div>

<div class="score-row">

<div class="score-team">
🏠 ${game.team2}
</div>

<input
class="score-input"
type="number"
min="0"
id="home-score-${game.id}"
value="${
game.home_score !== null
?
game.home_score
:
""
}"
placeholder="0"
>

</div>

${winnerText}

`;

resultsContainer.appendChild(
gameDiv
);

});

message.innerText =
"Week " +
week +
" games loaded. Enter final scores, then click Save Results.";

}

catch (error) {

console.error(
"Load Results error:",
error
);

message.innerText =
"Error loading games: " +
error.message;

}

}


// ==================================================
// SAVE RESULTS
// ==================================================
//
// Entering the scores automatically determines winner.
// ==================================================

async function saveResults() {

const message =
document.getElementById(
"resultsMessage"
);

message.innerText =
"Saving results...";

const scoreInputs =
document.querySelectorAll(
"#results .score-input"
);

if (
scoreInputs.length === 0
) {

message.innerText =
"Please load the games first.";

return;

}

let savedCount = 0;

let skippedCount = 0;

try {

const gameIds =
new Set();

scoreInputs.forEach(
input => {

const id =
input.id
.replace(
"away-score-",
""
)
.replace(
"home-score-",
""
);

gameIds.add(id);

});

for (
const gameId of gameIds
) {

const awayInput =
document.getElementById(
"away-score-" + gameId
);

const homeInput =
document.getElementById(
"home-score-" + gameId
);

const awayScore =
awayInput.value.trim();

const homeScore =
homeInput.value.trim();


// Don't save incomplete games.

if (
awayScore === "" ||
homeScore === ""
) {

skippedCount++;

continue;

}

const awayPoints =
Number(awayScore);

const homePoints =
Number(homeScore);

if (
Number.isNaN(awayPoints) ||
Number.isNaN(homePoints) ||
awayPoints < 0 ||
homePoints < 0
) {

throw new Error(
"Invalid score entered for game " +
gameId
);

}


// Ties are left without a winner.

let winner = null;

if (
awayPoints > homePoints
) {

const {
data: game,
error
} =
await supabaseClient
.from("games")
.select(
"team1"
)
.eq(
"id",
gameId
)
.single();

if (error) {
throw error;
}

winner =
game.team1;

}

else if (
homePoints > awayPoints
) {

const {
data: game,
error
} =
await supabaseClient
.from("games")
.select(
"team2"
)
.eq(
"id",
gameId
)
.single();

if (error) {
throw error;
}

winner =
game.team2;

}


// ==================================================
// SAVE SCORES + WINNER
// ==================================================

const {
error
} =
await supabaseClient
.from("games")
.update({

away_score:
awayPoints,

home_score:
homePoints,

Winner:
winner

})
.eq(
"id",
gameId
);

if (error) {
throw error;
}

savedCount++;

}


message.innerText =
"✅ Results saved! " +
savedCount +
" game(s) updated." +
(
skippedCount > 0
?
" " +
skippedCount +
" unfinished game(s) skipped."
:
""
);

}

catch (error) {

console.error(
"Save Results error:",
error
);

message.innerText =
"SAVE ERROR: " +
(error.code || "") +
" — " +
error.message;

}

}

</script>

</body>
</html>
