<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LamFam Admin — Set Games and Results</title>

<style>
body {
margin: 0;
font-family: Arial, sans-serif;
background: #f3f4f6;
color: #111827;
}

header {
background: #111827;
color: white;
text-align: center;
padding: 25px 15px;
}

header h1 {
margin: 0;
font-size: 28px;
}

main {
max-width: 700px;
margin: 25px auto;
padding: 15px;
}

.card {
background: white;
border-radius: 12px;
padding: 25px;
margin-bottom: 20px;
box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

input,
select {
width: 100%;
padding: 12px;
margin: 6px 0 15px;
box-sizing: border-box;
border: 1px solid #ccc;
border-radius: 6px;
font-size: 16px;
}

button {
padding: 12px 18px;
border: none;
border-radius: 7px;
cursor: pointer;
font-size: 16px;
margin-top: 10px;
}

.save {
background: #16a34a;
color: white;
width: 100%;
}

.game {
border: 1px solid #ddd;
border-radius: 8px;
padding: 15px;
margin: 15px 0;
}

h3 {
margin-top: 0;
}

hr {
margin: 30px 0;
border: 0;
border-top: 1px solid #ddd;
}

.info {
background: #f9fafb;
border: 1px solid #e5e7eb;
padding: 10px;
border-radius: 6px;
margin-bottom: 12px;
}

.home {
color: #166534;
font-weight: bold;
}

.time {
color: #1d4ed8;
font-weight: bold;
}
</style>
</head>

<body>

<header>
<h1>🏈 LamFam Admin</h1>
<p>Set up weekly football games and enter results</p>
</header>

<main>

<div class="card">

<h2>Week Setup</h2>

<label>Week Number</label>

<input
type="number"
id="week"
value="1"
min="1"
max="18"
>

<button
type="button"
class="save"
onclick="loadWeekGames()"
>
Load Week Games
</button>

<div id="games"></div>

<button
type="button"
class="save"
onclick="saveWeek()"
>
Save Week
</button>

<p id="message"></p>

<hr>

<h2>Game Results</h2>

<label>Results Week</label>

<input
type="number"
id="resultsWeek"
value="1"
min="1"
max="18"
>

<button
type="button"
class="save"
onclick="loadResults()"
>
Load Games
</button>

<p id="resultsMessage"></p>

<div id="results"></div>

<button
type="button"
class="save"
onclick="saveResults()"
>
Save Results
</button>

</div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://bgkcnsnydchfghyhwurw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_CzYkbEOaBmQbXroYYOXDbA_6NX6kZLz";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


// ==================================================
// STORE CURRENT WEEK GAMES
// ==================================================

let loadedGames = [];


// ==================================================
// LOAD WEEK GAMES DIRECTLY FROM DATABASE
// ==================================================

async function loadWeekGames() {

const week =
parseInt(
document.getElementById("week").value
);

const message =
document.getElementById("message");

const gamesContainer =
document.getElementById("games");

message.innerText =
"Loading Week " + week + " games...";

gamesContainer.innerHTML = "";

loadedGames = [];


try {

const {
data: games,
error
} =
await supabaseClient
.from("games")
.select(
"id,week,team1,team2,spread,home_team,game_time"
)
.eq(
"week",
week
)
.order(
"game_time",
{
ascending: true,
nullsFirst: false
}
)
.order(
"id",
{
ascending: true
}
);


if (error) {
throw error;
}


if (
!games ||
games.length === 0
) {

message.innerText =
"No games found for Week " +
week +
".";

return;

}


loadedGames =
games;


// ==================================================
// DISPLAY GAMES
// ==================================================

games.forEach(
(game,index) => {

const number =
index + 1;


const gameDiv =
document.createElement(
"div"
);

gameDiv.className =
"game";


const gameTime =
game.game_time
?
new Date(
game.game_time
).toLocaleString(
"en-US",
{
weekday: "short",
month: "short",
day: "numeric",
hour: "numeric",
minute: "2-digit"
}
)
:
"Not entered";


gameDiv.innerHTML = `

<h3>
Game ${number}
</h3>

<p>
<strong>${game.team1}</strong>
@
<strong>${game.team2}</strong>
</p>

<div class="info home">
Home: ${game.home_team || game.team2}
</div>

<div class="info time">
Game Time: ${gameTime}
</div>

<label>
Point Spread
</label>

<input
type="text"
id="spread-${game.id}"
value="${game.spread || ""}"
placeholder="Example: Patriots +3.5 / Seahawks -3.5"
>

`;

gamesContainer.appendChild(
gameDiv
);

});


message.innerText =
"Week " +
week +
" loaded. Review the spreads, then click Save Week.";

} catch (error) {

console.error(
"Load Week Games error:",
error
);

message.innerText =
"Error loading games: " +
error.message;

}

}


// ==================================================
// SAVE WEEK
// ==================================================
//
// IMPORTANT:
// Only updates the spread.
// Does NOT change:
// - game ID
// - teams
// - winner
// - scores
// - picks
//
// ==================================================

async function saveWeek() {

const week =
parseInt(
document.getElementById("week").value
);

const message =
document.getElementById("message");

message.innerText =
"Saving Week " +
week +
"...";


if (
!loadedGames ||
loadedGames.length === 0
) {

message.innerText =
"Please load the week first.";

return;

}


try {

let savedCount = 0;


for (
const game
of loadedGames
) {

const spreadInput =
document.getElementById(
"spread-" +
game.id
);


const spread =
spreadInput
?
spreadInput.value.trim()
:
game.spread || "";


const {
error
} =
await supabaseClient
.from("games")
.update({

spread:
spread

})
.eq(
"id",
game.id
);


if (error) {
throw error;
}


savedCount++;

}


message.innerText =
"✅ Week " +
week +
" saved successfully! " +
savedCount +
" spreads updated.";

} catch (error) {

console.error(
"Save Week error:",
error
);

message.innerText =
"Error saving Week " +
week +
": " +
error.message;

}

}


// ==================================================
// LOAD RESULTS
// ==================================================

async function loadResults() {

const week =
parseInt(
document.getElementById(
"resultsWeek"
).value
);

const resultsContainer =
document.getElementById(
"results"
);

const message =
document.getElementById(
"resultsMessage"
);

resultsContainer.innerHTML = "";

message.innerText =
"Loading games...";


try {

const {
data: games,
error
} =
await supabaseClient
.from("games")
.select(
"id,team1,team2,home_team,spread,game_time,Winner,home_score,away_score"
)
.eq(
"week",
week
)
.order(
"game_time",
{
ascending: true,
nullsFirst: false
}
)
.order(
"id",
{
ascending: true
}
);


if (error) {
throw error;
}


if (
!games ||
games.length === 0
) {

message.innerText =
"No games found for Week " +
week +
".";

return;

}


games.forEach(
game => {

const gameDiv =
document.createElement(
"div"
);

gameDiv.className =
"game";


const gameTime =
game.game_time
?
new Date(
game.game_time
).toLocaleString(
"en-US",
{
weekday: "short",
month: "short",
day: "numeric",
hour: "numeric",
minute: "2-digit"
}
)
:
"Not entered";


gameDiv.innerHTML = `

<h3>
${game.team1}
@
${game.team2}
</h3>

<p>
<strong>Home:</strong>
${game.home_team || game.team2}
</p>

<p>
<strong>Game Time:</strong>
${gameTime}
</p>

<p>
<strong>Spread:</strong>
${game.spread || "Not entered"}
</p>

<p>
<strong>Score:</strong>
${
game.away_score !== null &&
game.home_score !== null
?
`${game.team1}: ${game.away_score} — ${game.team2}: ${game.home_score}`
:
"Not entered"
}
</p>

<label>
Winner
</label>

<select
data-game-id="${game.id}"
>

<option value="">
Select Winner
</option>

<option value="${game.team1}">
${game.team1}
</option>

<option value="${game.team2}">
${game.team2}
</option>

</select>

`;


const select =
gameDiv.querySelector(
"select"
);


if (
game.Winner === game.team1
) {

select.value =
game.team1;

}


if (
game.Winner === game.team2
) {

select.value =
game.team2;

}


resultsContainer.appendChild(
gameDiv
);

});


message.innerText =
"Week " +
week +
" games loaded.";

} catch (error) {

console.error(
"Load Results error:",
error
);

message.innerText =
"Error loading games: " +
error.message;

}

}


// ==================================================
// SAVE RESULTS
// ==================================================

async function saveResults() {

const message =
document.getElementById(
"resultsMessage"
);

message.innerText =
"Saving results...";


const selects =
document.querySelectorAll(
"#results select[data-game-id]"
);


if (
selects.length === 0
) {

message.innerText =
"Please load the games first.";

return;

}


let savedCount = 0;


try {

for (
const select
of selects
) {

const winner =
select.value;


if (!winner) {
continue;
}


const gameId =
select.dataset.gameId;


const {
error
} =
await supabaseClient
.from("games")
.update({

Winner:
winner

})
.eq(
"id",
gameId
);


if (error) {
throw error;
}


savedCount++;

}


if (
savedCount === 0
) {

message.innerText =
"Please select at least one winner.";

return;

}


message.innerText =
"✅ Results saved successfully! " +
savedCount +
" game(s) updated.";

} catch (error) {

console.error(
"Save Results error:",
error
);

message.innerText =
"SAVE ERROR: " +
(error.code || "") +
" — " +
error.message;

}

}

</script>

</body>
</html>
