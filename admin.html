<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lamfam Admin-Set Games and Results</title>

<style>
body {
margin: 0;
font-family: Arial, sans-serif;
background: #f3f4f6;
color: #111827;
}

header {
background: #111827;
color: white;
text-align: center;
padding: 25px 15px;
}

main {
max-width: 700px;
margin: 25px auto;
padding: 15px;
}

.card {
background: white;
border-radius: 12px;
padding: 25px;
margin-bottom: 20px;
box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

input,
select {
width: 100%;
padding: 12px;
margin: 6px 0 15px;
box-sizing: border-box;
border: 1px solid #ccc;
border-radius: 6px;
font-size: 16px;
}

button {
padding: 12px 18px;
border: none;
border-radius: 7px;
cursor: pointer;
font-size: 16px;
margin-top: 10px;
}

.save {
background: #16a34a;
color: white;
width: 100%;
}

.game {
border: 1px solid #ddd;
border-radius: 8px;
padding: 15px;
margin: 15px 0;
}

h3 {
margin-top: 0;
}

hr {
margin: 30px 0;
border: 0;
border-top: 1px solid #ddd;
}
</style>
</head>

<body>

<header>
<h1>🏈 Lamfam Admin</h1>
<p>Set up weekly football games and enter results</p>
</header>

<main>

<div class="card">

<h2>Week Setup</h2>

<label>Week Number</label>

<input
type="number"
id="week"
value="1"
min="1"
max="18"
>
<button
type="button"
class="save"
onclick="loadWeekGames()"
>
Load Week Games
</button>

<div id="games"></div>

<button
class="save"
onclick="saveWeek()"
>
Save Week
</button>

<p id="message"></p>

<hr>

<h2>Game Results</h2>

<label>Results Week</label>

<input
type="number"
id="resultsWeek"
value="1"
min="1"
max="18"
>
<button
type="button"
class="save"
onclick="loadResults()"
>
Load Games
</button>
  



<p id="resultsMessage"></p>

<div id="results"></div>
<button
type="button"
class="save"
onclick="saveResults()"
>
Save Results
</button>



</div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://bgkcnsnydchfghyhwurw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_CzYkbEOaBmQbXroYYOXDbA_6NX6kZLz";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


// ==================================================
// CREATE WEEK SETUP FIELDS
// ==================================================

const gamesContainer =
document.getElementById("games");

for (let i = 1; i <= 18; i++) {

gamesContainer.innerHTML += `

<div class="game">

<h3>Game ${i}</h3>

<label>Team 1</label>

<input
type="text"
id="team1-${i}"
placeholder="Example: Kansas City Chiefs"
>

<label>Team 2</label>

<input
type="text"
id="team2-${i}"
placeholder="Example: Las Vegas Raiders"
>

<label>Point Spread</label>

<input
type="text"
id="spread-${i}"
placeholder="Example: Chiefs -3.5"
>

</div>

`;

}

// ==================================================
// LOAD WEEK GAMES
// ==================================================

async function loadWeekGames() {

const week = parseInt(
document.getElementById("week").value
);

const message =
document.getElementById("message");

message.innerText =
"Loading Week " + week + " games...";

try {

const response = await fetch(
"https://bgkcnsnydchfghyhwurw.supabase.co/functions/v1/get-nfl-games?week=" + week,
{
method: "POST",
headers: {
"Content-Type": "application/json"
}
}
);

if (!response.ok) {

throw new Error(
"NFL function returned " +
response.status
);

}

const nflGames =
await response.json();

if (!nflGames || nflGames.length === 0) {

message.innerText =
"No games found for Week " +
week + ".";

return;

}

nflGames.forEach((game, index) => {

if (index >= 18) return;

const number = index + 1;

document.getElementById(
`team1-${number}`
).value =
game.away_team || "";

document.getElementById(
`team2-${number}`
).value =
game.home_team || "";

const spread =
game.bookmakers?.[0]?.markets?.[0]?.outcomes
?.map(o =>
`${o.name} ${o.point > 0 ? "+" : ""}${o.point}`
)
.join(" / ") || "";

document.getElementById(
`spread-${number}`
).value =
spread;

});

message.innerText =
"Week " + week +
" games loaded. Review the spreads, then Save Week.";

} catch (error) {

console.error(error);

message.innerText =
"Error loading games: " +
error.message;

}

}

// ==================================================
// SAVE WEEK
// ==================================================

async function saveWeek() {

const week =
document.getElementById("week").value;

const games = [];

for (let i = 1; i <= 18; i++) {

const team1 =
document
.getElementById(`team1-${i}`)
.value
.trim();

const team2 =
document
.getElementById(`team2-${i}`)
.value
.trim();

const spread =
document
.getElementById(`spread-${i}`)
.value
.trim();

if (team1 && team2) {

games.push({

week: parseInt(week),

team1: team1,

team2: team2,

spread: spread

});

}

}

if (games.length === 0) {

document.getElementById("message").innerText =
"Please enter at least one game.";

return;

}

const { error } =
await supabaseClient
.from("games")
.delete()
.eq("week", parseInt(week));

if (error) {

document.getElementById("message").innerText =
"Error deleting old Week " + week + " games: " +
  error.message;

return;

}

const { error: insertError } =
await supabaseClient
.from("games")
.insert(games);

if (insertError) {

document.getElementById("message").innerText =
"Error: " + insertError.message;

return;

}

document.getElementById("message").innerText =
"Week " + week + " saved successfully!";

}


// ==================================================
// LOAD RESULTS
// ==================================================

async function loadResults() {
try {
const week = parseInt(
document.getElementById("resultsWeek").value
);

const resultsContainer =
document.getElementById("results");

const message =
document.getElementById("resultsMessage");

resultsContainer.innerHTML = "";
message.innerText = "Loading games...";
console.log("LOAD RESULTS STARTED");

const controller = new AbortController();
const timeout = setTimeout(
() => controller.abort(),
10000
);

const response = await fetch(
"https://bgkcnsnydchfghyhwurw.supabase.co/functions/v1/get-nfl-games?week=" + week,
{
method: "POST",
headers: {
"Content-Type": "application/json"
},
signal: controller.signal
}
);

clearTimeout(timeout);

if (!response.ok) {
throw new Error(
"NFL function returned " + response.status
);
}

const nflGames = await response.json();

const data = nflGames.map((game, index) => ({
id: index + 1,
team1: game.away_team,
team2: game.home_team,
spread:
game.bookmakers?.[0]?.markets?.[0]?.outcomes
?.map(o =>
`${o.name} ${o.point > 0 ? "+" : ""}${o.point}`
)
.join(" / ") || ""
}));

if (!data || data.length === 0) {
message.innerText = "No NFL games found.";
return;
}

message.innerText = "";

data.forEach(game => {
resultsContainer.innerHTML += `
<div class="game">

<h3>${game.team1} vs ${game.team2}</h3>

<p>${game.spread}</p>

<label>Winner</label>

<select id="winner-${game.id}">

<option value="">Select Winner</option>

<option value="${game.team1}">
${game.team1}
</option>

<option value="${game.team2}">
${game.team2}
</option>

</select>

</div>
`;
});

} catch (error) {
console.error("Load games error:", error);
message.innerText =
"Error loading games: " + error.message;
}
}




// ==================================================
// SAVE RESULTS
// ==================================================

async function saveResults() {
alert("SAVE RESULTS FUNCTION FIRED");

const message =
document.getElementById("resultsMessage");

message.innerText =
"Saving results...";

const week =
parseInt(
document.getElementById("resultsWeek").value
);

const { data: games, error: loadError } =
await supabaseClient
.from("games")
.select("id,team1,team2,Winner")
.eq("week", week)
.order("id");
alert("GAMES LOADED: + (games ? games.length : 0));

if (loadError) {

message.innerText =
"SAVE ERROR: " +
loadError.code +
" — " +
loadError.message;

return;

}

if (!games || games.length === 0) {

message.innerText =
"No games found.";

return;

}

let savedCount = 0;

for (const game of games) {

const select =
document.getElementById(
`winner-${game.id}`
);

if (!select) {
continue;
}

const winner =
select.value;

if (!winner) {
continue;
}

const { error } =
await supabaseClient
.from("games")
.update({
Winner: winner
})
.eq("id", game.id);

if (error) {

message.innerText =
"SAVE ERROR: " +
error.code +
" — " +
error.message;

return;

}

savedCount++;

}

if (savedCount === 0) {

message.innerText =
"Please select at least one winner.";

return;

}

message.innerText =
"Week " +
week +
" results saved successfully! " +
savedCount +
" game(s) updated.";

}

</script>

</body>
</html>
