<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lamfam Admin</title>

<style>
body {
margin: 0;
font-family: Arial, sans-serif;
background: #f3f4f6;
color: #111827;
}

header {
background: #111827;
color: white;
text-align: center;
padding: 25px 15px;
}

main {
max-width: 700px;
margin: 25px auto;
padding: 15px;
}

.card {
background: white;
border-radius: 12px;
padding: 25px;
margin-bottom: 20px;
box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

input {
width: 100%;
padding: 12px;
margin: 6px 0 15px;
box-sizing: border-box;
border: 1px solid #ccc;
border-radius: 6px;
font-size: 16px;
}

button {
padding: 12px 18px;
border: none;
border-radius: 7px;
cursor: pointer;
font-size: 16px;
margin-top: 10px;
}

.save {
background: #16a34a;
color: white;
width: 100%;
}

.game {
border: 1px solid #ddd;
border-radius: 8px;
padding: 15px;
margin: 15px 0;
}

h3 {
margin-top: 0;
}
</style>
</head>

<body>

<header>
<h1>🏈 Lamfam Admin</h1>
<p>Set up the weekly football games</p>
</header>

<main>

<div class="card">

<h2>Week Setup</h2>

<label>Week Number</label>
<input
type="number"
id="week"
value="1"
min="1"
max="18"
>

<div id="games"></div>

<button class="save" onclick="saveWeek()">
Save Week
</button>

<p id="message"></p>

</div>

</main>

<script>

const gamesContainer =
document.getElementById("games");

for (let i = 1; i <= 18; i++) {

gamesContainer.innerHTML += `

<div class="game">

<h3>Game ${i}</h3>

<label>Team 1</label>

<input
type="text"
id="team1-${i}"
placeholder="Example: Kansas City Chiefs"
>

<label>Team 2</label>

<input
type="text"
id="team2-${i}"
placeholder="Example: Las Vegas Raiders"
>

<label>Point Spread</label>

<input
type="text"
id="spread-${i}"
placeholder="Example: Chiefs -3.5"
>

</div>

`;

}
async function saveWeek() {

const week = document.getElementById("week").value;
const games = [];

for (let i = 1; i <= 18; i++) {

const team1 = document.getElementById(`team1-${i}`).value.trim();
const team2 = document.getElementById(`team2-${i}`).value.trim();
const spread = document.getElementById(`spread-${i}`).value.trim();

if (team1 && team2) {
games.push({
week: parseInt(week),
team1: team1,
team2: team2,
spread: spread
});
}
}

if (games.length === 0) {
document.getElementById("message").innerText =
"Please enter at least one game.";
return;
}

const { error } = await supabaseClient
.from("games")
.delete()
.eq("week", parseInt(week));

if (error) {
document.getElementById("message").innerText =
"Error: " + error.message;
return;
}

const { error: insertError } = await supabaseClient
.from("games")
.insert(games);

if (insertError) {
document.getElementById("message").innerText =
"Error: " + insertError.message;
return;
}

document.getElementById("message").innerText =
"Week " + week + " saved successfully!";
}

</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://bgkcnsnydchfghyhwurw.supabase.co";
const SUPABASE_KEY = "sb_publishable_CzYkbEOaBmQbXroYYOXDbA_6NX6kZLz";

const supabaseClient = supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);
</script>
</body>
</html>
