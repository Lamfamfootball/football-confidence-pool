<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LamFam Admin — Set Games and Results</title>

<style>
body {
margin: 0;
font-family: Arial, sans-serif;
background: #f3f4f6;
color: #111827;
}

header {
background: #111827;
color: white;
text-align: center;
padding: 25px 15px;
}

main {
max-width: 700px;
margin: 25px auto;
padding: 15px;
}

.card {
background: white;
border-radius: 12px;
padding: 25px;
margin-bottom: 20px;
box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

input,
select {
width: 100%;
padding: 12px;
margin: 6px 0 15px;
box-sizing: border-box;
border: 1px solid #ccc;
border-radius: 6px;
font-size: 16px;
}

button {
padding: 12px 18px;
border: none;
border-radius: 7px;
cursor: pointer;
font-size: 16px;
margin-top: 10px;
}

.save {
background: #16a34a;
color: white;
width: 100%;
}

.game {
border: 1px solid #ddd;
border-radius: 8px;
padding: 15px;
margin: 15px 0;
}

h3 {
margin-top: 0;
}

hr {
margin: 30px 0;
border: 0;
border-top: 1px solid #ddd;
}

.info {
background: #f9fafb;
border: 1px solid #e5e7eb;
padding: 10px;
border-radius: 6px;
margin-bottom: 12px;
}

.home {
color: #166534;
font-weight: bold;
}

.time {
color: #1d4ed8;
font-weight: bold;
}
</style>
</head>

<body>

<header>
<h1>🏈 LamFam Admin</h1>
<p>Set up weekly football games and enter results</p>
</header>

<main>

<div class="card">

<h2>Week Setup</h2>

<label>Week Number</label>

<input
type="number"
id="week"
value="1"
min="1"
max="18"
>

<button
type="button"
class="save"
onclick="loadWeekGames()"
>
Load Week Games
</button>

<div id="games"></div>

<button
type="button"
class="save"
onclick="saveWeek()"
>
Save Week
</button>

<p id="message"></p>

<hr>

<h2>Game Results</h2>

<label>Results Week</label>

<input
type="number"
id="resultsWeek"
value="1"
min="1"
max="18"
>

<button
type="button"
class="save"
onclick="loadResults()"
>
Load Games
</button>

<p id="resultsMessage"></p>

<div id="results"></div>

<button
type="button"
class="save"
onclick="saveResults()"
>
Save Results
</button>

</div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://bgkcnsnydchfghyhwurw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_CzYkbEOaBmQbXroYYOXDbA_6NX6kZLz";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


// ==================================================
// STORE AUTOMATICALLY LOADED GAME INFORMATION
// ==================================================

let loadedGames = [];


// ==================================================
// CREATE WEEK SETUP FIELDS
// ==================================================

const gamesContainer =
document.getElementById("games");

for (let i = 1; i <= 18; i++) {

gamesContainer.innerHTML += `

<div class="game">

<h3>Game ${i}</h3>

<label>Team 1 — Away</label>

<input
type="text"
id="team1-${i}"
placeholder="Away team"
>

<label>Team 2 — Home</label>

<input
type="text"
id="team2-${i}"
placeholder="Home team"
>

<div
id="home-${i}"
class="info home"
>
Home: —
</div>

<div
id="time-${i}"
class="info time"
>
Game Time: —
</div>

<label>Point Spread</label>

<input
type="text"
id="spread-${i}"
placeholder="Spread"
>

</div>

`;

}


// ==================================================
// LOAD WEEK GAMES
// ==================================================

async function loadWeekGames() {

const week =
parseInt(
document.getElementById("week").value
);

const message =
document.getElementById("message");

message.innerText =
"Loading Week " + week + " games...";

loadedGames = [];

try {

const response =
await fetch(
"https://bgkcnsnydchfghyhwurw.supabase.co/functions/v1/get-nfl-games?week=" + week,
{
method: "POST",
headers: {
"Content-Type": "application/json"
}
}
);

if (!response.ok) {

throw new Error(
"NFL function returned " +
response.status
);

}

const nflGames =
await response.json();

if (
!nflGames ||
nflGames.length === 0
) {

message.innerText =
"No games found for Week " +
week +
".";

return;

}


// Store automatic game information
loadedGames = nflGames;


// Fill Admin page
nflGames.forEach(
(game, index) => {

if (index >= 18) {
return;
}

const number =
index + 1;


// ------------------------------------------
// TEAMS
// ------------------------------------------

document.getElementById(
`team1-${number}`
).value =
game.away_team || "";

document.getElementById(
`team2-${number}`
).value =
game.home_team || "";


// ------------------------------------------
// HOME TEAM
// ------------------------------------------

document.getElementById(
`home-${number}`
).innerText =
"Home: " +
(game.home_team || "Not entered");


// ------------------------------------------
// GAME TIME
// ------------------------------------------

if (game.commence_time) {

const gameDate =
new Date(
game.commence_time
);

document.getElementById(
`time-${number}`
).innerText =
"Game Time: " +
gameDate.toLocaleString(
"en-US",
{
weekday: "short",
month: "short",
day: "numeric",
hour: "numeric",
minute: "2-digit"
}
);

} else {

document.getElementById(
`time-${number}`
).innerText =
"Game Time: Not entered";

}


// ------------------------------------------
// SPREAD
// ------------------------------------------

const spread =
game.bookmakers?.[0]
?.markets?.[0]
?.outcomes
?.map(
o =>
`${o.name} ${
o.point > 0 ? "+" : ""
}${o.point}`
)
.join(" / ") || "";

document.getElementById(
`spread-${number}`
).value =
spread;

}
);


message.innerText =
"Week " +
week +
" games loaded. Review the games, then click Save Week.";

} catch (error) {

console.error(error);

message.innerText =
"Error loading games: " +
error.message;

}

}


// ==================================================
// SAVE WEEK
// ==================================================
// IMPORTANT:
// This version DOES NOT delete the old games.
// It updates existing games when the same matchup
// already exists, preserving the game ID.
// This keeps player Picks linked to their games.
// ==================================================

async function saveWeek() {

const week =
parseInt(
document.getElementById("week").value
);

const message =
document.getElementById("message");

message.innerText =
"Saving Week " + week + "...";


if (
!loadedGames ||
loadedGames.length === 0
) {

message.innerText =
"Please load the NFL games first.";

return;

}


try {

// Get current games for this week
const {
data: existingGames,
error: existingError
} =
await supabaseClient
.from("games")
.select(
"id,week,team1,team2,home_team,spread,game_time"
)
.eq(
"week",
week
);

if (existingError) {

throw existingError;

}


// ==================================================
// SAVE EACH LOADED NFL GAME
// ==================================================

let savedCount = 0;

for (
let i = 0;
i < loadedGames.length && i < 18;
i++
) {

const nflGame =
loadedGames[i];

const team1 =
nflGame.away_team ||
"";

const team2 =
nflGame.home_team ||
"";

const homeTeam =
nflGame.home_team ||
team2;

const gameTime =
nflGame.commence_time ||
null;


// ------------------------------------------
// GET SPREAD
// ------------------------------------------

const spread =
nflGame.bookmakers?.[0]
?.markets?.[0]
?.outcomes
?.map(
o =>
`${o.name} ${
o.point > 0 ? "+" : ""
}${o.point}`
)
.join(" / ") || "";


// ------------------------------------------
// FIND EXISTING GAME
// ------------------------------------------
// Match by teams, regardless of order.
// ------------------------------------------

const existingGame =
(existingGames || []).find(
game =>
(
game.team1 === team1 &&
game.team2 === team2
)
||
(
game.team1 === team2 &&
game.team2 === team1
)
);


// ------------------------------------------
// UPDATE EXISTING GAME
// ------------------------------------------

if (existingGame) {

const {
error: updateError
} =
await supabaseClient
.from("games")
.update({

team1:
team1,

team2:
team2,

home_team:
homeTeam,

spread:
spread,

game_time:
gameTime

})
.eq(
"id",
existingGame.id
);

if (updateError) {

throw updateError;

}

savedCount++;


// ------------------------------------------
// INSERT NEW GAME
// ------------------------------------------

} else {

const {
error: insertError
} =
await supabaseClient
.from("games")
.insert({

week:
week,

team1:
team1,

team2:
team2,

home_team:
homeTeam,

spread:
spread,

game_time:
gameTime

});

if (insertError) {

throw insertError;

}

savedCount++;

}

}


// ==================================================
// FINISHED
// ==================================================

message.innerText =
"✅ Week " +
week +
" saved successfully! " +
savedCount +
" games saved. Existing game IDs were preserved.";

} catch (error) {

console.error(
"Save Week error:",
error
);

message.innerText =
"Error saving Week " +
week +
": " +
error.message;

}

}


// ==================================================
// LOAD RESULTS
// ==================================================

async function loadResults() {

const week =
parseInt(
document.getElementById(
"resultsWeek"
).value
);

const resultsContainer =
document.getElementById(
"results"
);

const message =
document.getElementById(
"resultsMessage"
);

resultsContainer.innerHTML = "";

message.innerText =
"Loading games...";


try {

const {
data: games,
error
} =
await supabaseClient
.from("games")
.select(
"id,team1,team2,home_team,spread,game_time,Winner,home_score,away_score"
)
.eq(
"week",
week
)
.order(
"id"
);


if (error) {
throw error;
}


if (
!games ||
games.length === 0
) {

message.innerText =
"No games found for Week " +
week +
".";

return;

}


games.forEach(
game => {

const gameDiv =
document.createElement(
"div"
);

gameDiv.className =
"game";


const gameTime =
game.game_time
?
new Date(
game.game_time
).toLocaleString(
"en-US",
{
weekday: "short",
month: "short",
day: "numeric",
hour: "numeric",
minute: "2-digit"
}
)
:
"Not entered";


gameDiv.innerHTML = `

<h3>
${game.team1}
vs
${game.team2}
</h3>

<p>
<strong>Home:</strong>
${game.home_team || "N/A"}
</p>

<p>
<strong>Game Time:</strong>
${gameTime}
</p>

<p>
<strong>Spread:</strong>
${game.spread || "Not entered"}
</p>

<p>
<strong>Score:</strong>
${
game.away_score !== null &&
game.home_score !== null
?
`${game.team1}: ${game.away_score} — ${game.team2}: ${game.home_score}`
:
"Not final"
}
</p>

<label>
Winner
</label>

<select
data-game-id="${game.id}"
>

<option value="">
Select Winner
</option>

<option value="${game.team1}">
${game.team1}
</option>

<option value="${game.team2}">
${game.team2}
</option>

</select>

`;


const select =
gameDiv.querySelector(
"select"
);


if (
game.Winner === game.team1
) {

select.value =
game.team1;

}


if (
game.Winner === game.team2
) {

select.value =
game.team2;

}


resultsContainer.appendChild(
gameDiv
);

});


message.innerText =
"Week " +
week +
" games loaded.";

} catch (error) {

console.error(
"Load results error:",
error
);

message.innerText =
"Error loading games: " +
error.message;

}

}


// ==================================================
// SAVE RESULTS
// ==================================================

async function saveResults() {

const message =
document.getElementById(
"resultsMessage"
);

message.innerText =
"Saving results...";


const selects =
document.querySelectorAll(
"#results select[data-game-id]"
);


if (
selects.length === 0
) {

message.innerText =
"Please load the games first.";

return;

}


let savedCount = 0;


try {

for (
const select
of selects
) {

const winner =
select.value;


if (!winner) {
continue;
}


const gameId =
select.dataset.gameId;


const {
error
} =
await supabaseClient
.from("games")
.update({

Winner:
winner

})
.eq(
"id",
gameId
);


if (error) {
throw error;
}


savedCount++;

}


if (
savedCount === 0
) {

message.innerText =
"Please select at least one winner.";

return;

}


message.innerText =
"Results saved successfully! " +
savedCount +
" game(s) updated.";

} catch (error) {

console.error(
"Save results error:",
error
);

message.innerText =
"SAVE ERROR: " +
(error.code || "") +
" — " +
error.message;

}

}

</script>

</body>
</html>
