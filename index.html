<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lamfam 2026 Football Pool</title>

<style>
body {
margin: 0;
font-family: Arial, sans-serif;
background: #f3f4f6;
color: #111827;
}

header {
background: #111827;
color: white;
text-align: center;
padding: 25px 15px;
}

header h1 {
margin: 0;
font-size: 30px;
}

main {
max-width: 700px;
margin: 25px auto;
padding: 15px;
}

.card {
background: white;
border-radius: 12px;
padding: 25px;
margin-bottom: 20px;
box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

input {
width: 100%;
padding: 12px;
margin: 8px 0 20px;
box-sizing: border-box;
border: 1px solid #ccc;
border-radius: 6px;
font-size: 16px;
}

.game {
border: 1px solid #ddd;
border-radius: 10px;
padding: 15px;
margin: 12px 0;
}

.game-title {
font-weight: bold;
font-size: 17px;
margin-bottom: 8px;
}

.spread {
color: #555;
margin-bottom: 12px;
}

button {
padding: 10px 14px;
border: none;
border-radius: 7px;
cursor: pointer;
font-size: 15px;
margin: 4px;
}

.team {
background: #e5e7eb;
}

.team.selected {
background: #2563eb;
color: white;
}

select {
padding: 10px;
border-radius: 7px;
border: 1px solid #bbb;
font-size: 15px;
margin: 4px;
}

.summary {
background: #f9fafb;
border-radius: 8px;
padding: 15px;
margin-top: 20px;
}

.submit {
background: #16a34a;
color: white;
width: 100%;
margin-top: 20px;
font-size: 17px;
}

.message {
margin-top: 15px;
font-weight: bold;
text-align: center;
}
</style>
</head>

<body>

<header>
<h1>🏈 Lamfam 2026 Football Pool</h1>
<p>Pick your Top 10 games against the spread</p>
</header>

<main>

<div class="card">

<h2>Enter Your Name</h2>

<input
type="text"
id="playerName"
placeholder="Your name"
>

<h2>Week 1</h2>

<p>
Choose a team in each game and assign points
from <strong>10 down to 1</strong>.
</p>

<div id="games"></div>

<div class="summary">
<strong>Points used:</strong>
<div id="pointsUsed">None</div>
</div>

<button class="submit" onclick="submitPicks()">
Submit My Picks
</button>

<div id="message" class="message"></div>

</div>

</main>

<script>

const games = [
{ id: 1, team1: "Team A", team2: "Team B", spread: "Team A -3.5" },
{ id: 2, team1: "Team C", team2: "Team D", spread: "Team C +2.5" },
{ id: 3, team1: "Team E", team2: "Team F", spread: "Team E -1.5" },
{ id: 4, team1: "Team G", team2: "Team H", spread: "Team H -4.5" },
{ id: 5, team1: "Team I", team2: "Team J", spread: "Team I +3.5" },
{ id: 6, team1: "Team K", team2: "Team L", spread: "Team L -2.5" },
{ id: 7, team1: "Team M", team2: "Team N", spread: "Team M -6.5" },
{ id: 8, team1: "Team O", team2: "Team P", spread: "Team P +1.5" },
{ id: 9, team1: "Team Q", team2: "Team R", spread: "Team Q -3.5" },
{ id: 10, team1: "Team S", team2: "Team T", spread: "Team T +5.5" }
];

const selections = {};

function displayGames() {

const container = document.getElementById("games");

games.forEach(game => {

const div = document.createElement("div");

div.className = "game";

div.innerHTML = `
<div class="game-title">
${game.team1} vs ${game.team2}
</div>

<div class="spread">
Spread: ${game.spread}
</div>

<div>
<strong>Pick:</strong><br>

<button
class="team"
onclick="selectTeam(${game.id}, '${game.team1}', this)">
${game.team1}
</button>

<button
class="team"
onclick="selectTeam(${game.id}, '${game.team2}', this)">
${game.team2}
</button>
</div>

<div style="margin-top:10px;">
<strong>Points:</strong>

<select onchange="selectPoints(${game.id}, this.value)">
<option value="">Select</option>
<option value="10">10</option>
<option value="9">9</option>
<option value="8">8</option>
<option value="7">7</option>
<option value="6">6</option>
<option value="5">5</option>
<option value="4">4</option>
<option value="3">3</option>
<option value="2">2</option>
<option value="1">1</option>
</select>
</div>
`;

container.appendChild(div);

});

}

function selectTeam(gameId, team, button) {

if (!selections[gameId]) {
selections[gameId] = {};
}

selections[gameId].team = team;

const parent = button.parentElement;

parent.querySelectorAll(".team")
.forEach(b => b.classList.remove("selected"));

button.classList.add("selected");
}

function selectPoints(gameId, points) {

if (!points) return;

points = Number(points);

const existingGame = Object.keys(selections).find(id =>
Number(id) !== gameId &&
selections[id].points === points
);

if (existingGame) {

alert(
"You already used " +
points +
" points. Each point value can only be used once."
);

return;
}

if (!selections[gameId]) {
selections[gameId] = {};
}

selections[gameId].points = points;

updatePointsUsed();
}

function updatePointsUsed() {

const used = Object.values(selections)
.map(p => p.points)
.filter(Boolean)
.sort((a,b) => b-a);

document.getElementById("pointsUsed").innerText =
used.length ? used.join(", ") : "None";
}

function submitPicks() {

const name =
document.getElementById("playerName").value.trim();

if (!name) {

document.getElementById("message").innerText =
"Please enter your name.";

return;
}

const picks = Object.values(selections);

if (picks.length !== 10) {

document.getElementById("message").innerText =
"Please select exactly 10 games.";

return;
}

const missingTeam =
picks.some(p => !p.team);

if (missingTeam) {

document.getElementById("message").innerText =
"Please select a team for every pick.";

return;
}

const points =
picks.map(p => p.points);

if (points.includes(undefined)) {

document.getElementById("message").innerText =
"Please assign a point value to every pick.";

return;
}

const uniquePoints =
new Set(points);

if (uniquePoints.size !== 10) {

document.getElementById("message").innerText =
"You must use each point value from 10 through 1 exactly once.";

return;
}

document.getElementById("message").innerText =
"Picks submitted successfully!";

}

displayGames();

</script>

</body>
</html>
