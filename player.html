<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LamFam Football Pool</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
font-family: Arial, sans-serif;
margin: 20px;
background: #f4f4f4;
}

.game {
background: white;
padding: 15px;
margin-bottom: 12px;
border-radius: 8px;
}

.team {
font-weight: bold;
font-size: 18px;
}

.pick-button {
margin-top: 8px;
padding: 8px 12px;
cursor: pointer;
}

#games {
max-width: 700px;
margin: auto;
}
</style>
</head>

<body>

<div id="games">
<h1>LamFam Football Pool</h1>
<h2>Week 1</h2>
<p id="status">Loading games...</p>
<div id="gameList"></div>
</div>

<script>
const SUPABASE_URL = "https://bgkcnsnydchfghyhwurw.supabase.co";
const SUPABASE_KEY = "sb_publishable_CzYkbEOaBmQbXroYYOXDbA_6NX6kZLz";

const supabaseClient = supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

async function loadGames() {
const { data, error } = await supabaseClient
.from("games")
.select("*")
.eq("week", 1)
.order("id");

if (error) {
console.error(error);
document.getElementById("status").innerText =
"Unable to load games.";
return;
}

const gameList = document.getElementById("gameList");
gameList.innerHTML = "";

if (!data || data.length === 0) {
document.getElementById("status").innerText =
"No games have been entered yet.";
return;
}

document.getElementById("status").innerText = "";

data.forEach((game, index) => {
const div = document.createElement("div");
div.className = "game";

div.innerHTML = `
<div>Game ${index + 1}</div>
<div class="team">${game.team1}</div>
<div>vs.</div>
<div class="team">${game.team2}</div>
<div>Spread: ${game.spread}</div>
`;

gameList.appendChild(div);
});
}

loadGames();
</script>

</body>
</html>
