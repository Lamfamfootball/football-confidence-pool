<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LamFam 2026-2027 Live Picks</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
margin: 0;
font-family: Arial, sans-serif;
background: #f3f4f6;
color: #111827;
}

header {
background: #111827;
color: white;
text-align: center;
padding: 25px 15px;
}

header h1 {
margin: 0;
font-size: 28px;
}

main {
max-width: 1200px;
margin: 20px auto;
padding: 15px;
}

.card {
background: white;
border-radius: 12px;
padding: 20px;
margin-bottom: 20px;
box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

.controls {
display: flex;
gap: 10px;
align-items: center;
flex-wrap: wrap;
}

select,
button {
padding: 10px 14px;
border-radius: 7px;
border: 1px solid #bbb;
font-size: 16px;
}

button {
background: #2563eb;
color: white;
border: none;
cursor: pointer;
}

#status {
font-weight: bold;
}

.table-wrapper {
overflow-x: auto;
}

table {
border-collapse: collapse;
width: max-content;
min-width: 100%;
}

th,
td {
border: 1px solid #d1d5db;
padding: 10px;
text-align: center;
white-space: nowrap;
}

th {
background: #111827;
color: white;
}

.confidence {
font-weight: bold;
background: #e5e7eb;
position: sticky;
left: 0;
z-index: 2;
}

.player-header {
min-width: 120px;
}

.pick {
min-width: 120px;
font-weight: bold;
}

.pending {
background: #f3f4f6;
}

.correct {
background: #bbf7d0;
color: #166534;
}

.incorrect {
background: #fecaca;
color: #991b1b;
}

.total {
font-size: 18px;
font-weight: bold;
background: #dbeafe;
}

.season-win {
font-size: 18px;
font-weight: bold;
background: #dcfce7;
color: #166534;
}

.small {
font-size: 13px;
color: #6b7280;
}

.spread-info {
font-size: 12px;
color: #374151;
margin-top: 3px;
}
</style>
</head>

<body>

<header>
<h1>🏈 LamFam 2026-2027 — Live Weekly Picks</h1>
<p>Watch the pool standings change as games finish</p>
</header>

<main>

<div class="card">

<div class="controls">

<label for="weekSelect">
<strong>Week:</strong>
</label>

<select id="weekSelect">

<option value="1">Week 1</option>
<option value="2">Week 2</option>
<option value="3">Week 3</option>
<option value="4">Week 4</option>
<option value="5">Week 5</option>
<option value="6">Week 6</option>
<option value="7">Week 7</option>
<option value="8">Week 8</option>
<option value="9">Week 9</option>
<option value="10">Week 10</option>
<option value="11">Week 11</option>
<option value="12">Week 12</option>
<option value="13">Week 13</option>
<option value="14">Week 14</option>
<option value="15">Week 15</option>
<option value="16">Week 16</option>
<option value="17">Week 17</option>
<option value="18">Week 18</option>

</select>

<button onclick="loadLivePicks()">
Refresh
</button>

</div>

<p id="status">Loading...</p>

<p class="small">
Weekly confidence points reset each week. Season wins accumulate throughout the season.
</p>

</div>


<!-- CURRENT WEEK -->

<div class="card">

<h2>🏆 Current Week Standings</h2>

<div id="weeklyStandings"></div>

</div>


<!-- SEASON -->

<div class="card">

<h2>🏆 Season Standings</h2>

<div id="seasonStandings"></div>

</div>


<!-- PICKS -->

<div class="card">

<h2>Player Picks</h2>

<div class="table-wrapper">

<div id="liveTable">
Loading picks...
</div>

</div>

</div>

</main>


<script>

const SUPABASE_URL =
"https://bgkcnsnydchfghyhwurw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_CzYkbEOaBmQbXroYYOXDbA_6NX6kZLz";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


// ==================================================
// PARSE SPREAD
// ==================================================

function parseSpreadForTeam(
spreadText,
team
) {

if (!spreadText) {
return null;
}

const parts =
spreadText.split("/");

for (const part of parts) {

const text =
part.trim();

const match =
text.match(
/^(.*?)\s+([+-]?\d+(?:\.\d+)?)$/
);

if (!match) {
continue;
}

const teamName =
match[1].trim();

const spread =
Number(match[2]);

if (
teamName === team
) {

return spread;

}

}

return null;

}


// ==================================================
// DETERMINE IF PICK WON AGAINST SPREAD
// ==================================================

function pickCovered(
game,
pickedTeam
) {

const homeScore =
Number(game.home_score);

const awayScore =
Number(game.away_score);

if (
Number.isNaN(homeScore) ||
Number.isNaN(awayScore)
) {

return false;

}

const homeTeam =
game.home_team;

const awayTeam =
homeTeam === game.team1
? game.team2
: game.team1;

const pickedScore =
pickedTeam === homeTeam
? homeScore
: awayScore;

const opponentScore =
pickedTeam === homeTeam
? awayScore
: homeScore;

const spread =
parseSpreadForTeam(
game.spread,
pickedTeam
);

if (
spread === null
) {

return false;

}


// --------------------------------------------------
// APPLY SPREAD
// --------------------------------------------------

const adjustedScore =
pickedScore + spread;


// --------------------------------------------------
// PUSH COUNTS AS A WIN
// --------------------------------------------------

return adjustedScore >= opponentScore;

}


// ==================================================
// LOAD LIVE PICKS
// ==================================================

async function loadLivePicks() {

const selectedWeek =
parseInt(
document.getElementById(
"weekSelect"
).value
);

const status =
document.getElementById(
"status"
);

status.innerText =
"Loading live results...";


// ==================================================
// GET GAMES
// ==================================================

const {
data: games,
error: gamesError
} =
await supabaseClient
.from("games")
.select(
"id,week,team1,team2,home_team,spread,home_score,away_score"
)
.eq(
"week",
selectedWeek
);

if (gamesError) {

console.error(
gamesError
);

status.innerText =
"Error loading games.";

return;

}


// ==================================================
// GET PICKS
// ==================================================

const {
data: allPicks,
error: picksError
} =
await supabaseClient
.from("Picks")
.select(
"player-name,game_id,team-picked,confidence,week"
);

if (picksError) {

console.error(
picksError
);

status.innerText =
"Error loading picks.";

return;

}


// ==================================================
// UPDATE SCORES FROM NFLDATA
// ==================================================

try {

const response =
await fetch(
SUPABASE_URL +
"/functions/v1/get-nfl-scores?week=" +
selectedWeek,
{
method: "POST"
}
);

if (!response.ok) {

console.error(
"Score function HTTP status:",
response.status
);

throw new Error(
"Score function failed"
);

}

const scoreResult =
await response.json();

console.log(
"Score update:",
scoreResult
);

} catch (error) {

console.error(
"Score update error:",
error
);

// Do NOT stop the page.
// It can still display whatever
// scores are already stored.

}


// ==================================================
// RELOAD GAMES AFTER SCORE UPDATE
// ==================================================

const {
data: updatedGames,
error: updatedGamesError
} =
await supabaseClient
.from("games")
.select(
"id,week,team1,team2,home_team,spread,home_score,away_score"
)
.eq(
"week",
selectedWeek
);

if (updatedGamesError) {

console.error(
updatedGamesError
);

status.innerText =
"Error loading updated games.";

return;

}


// ==================================================
// BUILD RESULTS
// ==================================================

const results = {};

updatedGames.forEach(
game => {

const hasScores =
game.home_score !== null &&
game.home_score !== undefined &&
game.away_score !== null &&
game.away_score !== undefined;

results[game.id] = {

completed:
hasScores,

game:
game

};

});


// ==================================================
// BUILD PLAYER LIST
// ==================================================

const players = [];

allPicks.forEach(
pick => {

const name =
pick["player-name"];

if (
name &&
!players.includes(name)
) {

players.push(name);

}

});


// ==================================================
// BUILD WEEKLY DATA
// ==================================================

const weeklyData = {};

players.forEach(
player => {

weeklyData[player] = {

picks: {},

points: 0

};

});


allPicks
.filter(
pick =>
Number(pick.week) ===
selectedWeek
)
.forEach(
pick => {

const player =
pick["player-name"];

const confidence =
Number(pick.confidence);

weeklyData[player].picks[
confidence
] = {

team:
pick["team-picked"],

gameId:
pick.game_id

};


const result =
results[pick.game_id];

if (
result &&
result.completed
) {

if (
pickCovered(
result.game,
pick["team-picked"]
)
) {

weeklyData[player].points +=
confidence;

}

}

});

// ==================================================
// BUILD SEASON DATA
// ==================================================

// Get every game with saved final scores
const {
data: seasonGames,
error: seasonGamesError
} =
await supabaseClient
.from("games")
.select(
"id,week,team1,team2,home_team,spread,home_score,away_score"
);

if (seasonGamesError) {

console.error(
"Season games error:",
seasonGamesError
);

status.innerText =
"Error loading season games.";

return;

}


const seasonResults = {};

seasonGames.forEach(
game => {

const hasScores =
game.home_score !== null &&
game.home_score !== undefined &&
game.away_score !== null &&
game.away_score !== undefined;

seasonResults[game.id] = {

completed:
hasScores,

game:
game

};

});


const seasonData = {};

players.forEach(
player => {

seasonData[player] = {

wins: 0

};

});


allPicks.forEach(
pick => {

const player =
pick["player-name"];

const result =
seasonResults[pick.game_id];

if (
result &&
result.completed
) {

if (
pickCovered(
result.game,
pick["team-picked"]
)
) {

seasonData[player].wins++;

}

}

});


// ==================================================
// WEEKLY STANDINGS
// ==================================================

const weeklyPlayers =
[...players].sort(
(a,b) => {

return (
weeklyData[b].points -
weeklyData[a].points
);

});


let weeklyHtml = `

<table>

<thead>

<tr>

<th>Rank</th>
<th>Player</th>
<th>Confidence Points</th>

</tr>

</thead>

<tbody>
`;


weeklyPlayers.forEach(
(player,index) => {

weeklyHtml += `

<tr>

<td>
${index + 1}
</td>

<td>
<strong>
${player}
</strong>
</td>

<td class="total">
${weeklyData[player].points}
</td>

</tr>
`;

});


weeklyHtml += `

</tbody>
</table>
`;

document.getElementById(
"weeklyStandings"
).innerHTML =
weeklyHtml;


// ==================================================
// SEASON STANDINGS
// ==================================================

const seasonPlayers =
[...players].sort(
(a,b) => {

return (
seasonData[b].wins -
seasonData[a].wins
);

});


let seasonHtml = `

<table>

<thead>

<tr>

<th>Rank</th>
<th>Player</th>
<th>Total Wins</th>

</tr>

</thead>

<tbody>
`;


seasonPlayers.forEach(
(player,index) => {

seasonHtml += `

<tr>

<td>
${index + 1}
</td>

<td>
<strong>
${player}
</strong>
</td>

<td class="season-win">
${seasonData[player].wins}
</td>

</tr>
`;

});


seasonHtml += `

</tbody>
</table>
`;

document.getElementById(
"seasonStandings"
).innerHTML =
seasonHtml;


// ==================================================
// BUILD PLAYER DATA
// ==================================================

const playerData = {};

players.forEach(
player => {

playerData[player] = {

picks:
weeklyData[player].picks,

points:
weeklyData[player].points

};

});


// ==================================================
// SORT PLAYERS
// ==================================================

const displayPlayers =
[...players].sort(
(a,b) => {

return (
weeklyData[b].points -
weeklyData[a].points
);

});


// ==================================================
// BUILD PLAYER TABLE
// ==================================================

let html = `

<table>

<thead>

<tr>

<th class="confidence">
Confidence
</th>
`;

displayPlayers.forEach(
player => {

html += `

<th class="player-header">
${player}
</th>
`;

});

html += `

</tr>

</thead>

<tbody>
`;


// ==================================================
// CONFIDENCE 10 DOWN TO 1
// ==================================================

for (
let confidence = 10;
confidence >= 1;
confidence--
) {

html += `

<tr>

<td class="confidence">
${confidence}
</td>
`;

displayPlayers.forEach(
player => {

const pick =
playerData[player].picks[
confidence
];

if (!pick) {

html += `

<td class="pending">
—
</td>
`;

return;

}

const result =
results[pick.gameId];

let className =
"pending";

if (
result &&
result.completed
) {

if (
pickCovered(
result.game,
pick.team
)
) {

className =
"correct";

} else {

className =
"incorrect";

}

}

html += `

<td class="pick ${className}">

${pick.team}

${
result &&
result.game &&
result.game.spread
?
`<div class="spread-info">
${result.game.spread}
</div>`
:
""
}

</td>
`;

});

html += `

</tr>
`;

}


// ==================================================
// TOTAL
// ==================================================

html += `

<tr>

<td class="confidence">
TOTAL
</td>
`;

displayPlayers.forEach(
player => {

html += `

<td class="total">
${playerData[player].points}
</td>
`;

});

html += `

</tr>
`;

html += `

</tbody>
</table>
`;

document.getElementById(
"liveTable"
).innerHTML =
html;


status.innerText =
"Last updated: " +
new Date().toLocaleTimeString();

}


// ==================================================
// INITIAL LOAD
// ==================================================

loadLivePicks();


// ==================================================
// AUTO REFRESH EVERY 60 SECONDS
// ==================================================

setInterval(
loadLivePicks,
60000
);

</script>

</body>
</html>
